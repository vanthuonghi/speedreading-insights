    <!-- Font chữ đẹp -->

    <style>
        body { font-family: 'Inter', sans-serif; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

            from { opacity: 0; }
            to { opacity: 1; }

<body>
    <div id="root"></div>

        import {

            ChevronDown, ChevronUp, Star, Zap, ShieldCheck, 
            ArrowRight, User, Mail, Phone, Loader, PlayCircle, 
            Building, GraduationCap, Users, Quote, XCircle, Target,
            Calendar, Music, FileText, CheckSquare, Gift, Video, Book,
            Lock, Play, X, Trophy, Cpu, Sparkles, Compass
        } from 'lucide-react';

        // --- Data ---
        const ROADMAP_DATA = [
            { id: 1, title: "Tháng 1-2: Xóa bỏ rào cản - Nền tảng Speed Reading", desc: "Đánh giá năng lực hiện tại, loại bỏ thói quen đọc thầm, mở rộng tầm nhìn ngoại vi. Tăng tốc độ đọc hiểu cơ bản giúp quý anh chị tiết kiệm thời gian tiếp thu.", icon: Zap },
            { id: 2, title: "Tháng 3-4: Đọc sâu & Ghi nhớ dài hạn", desc: "Áp dụng kỹ thuật Mindmap, sơ đồ hóa khối lượng kiến thức khổng lồ. Rất phù hợp cho quý anh chị đang trong giai đoạn ôn thi hoặc nghiên cứu chuyên môn.", icon: Brain },
            { id: 3, title: "Tháng 5-6: Ứng dụng Trí Tuệ Nhân Tạo (AI) vào học tập", desc: "Hướng dẫn quý khách hàng sử dụng các công cụ AI (ChatGPT, Claude...) để tóm tắt sách, phân tích tài liệu và tạo ra trợ lý học tập cá nhân.", icon: Cpu },
            { id: 4, title: "Tháng 7-8: Tối ưu hóa năng suất làm việc", desc: "Xây dựng quy trình làm việc thông minh. Áp dụng kỹ năng đọc nhanh và AI để xử lý hàng trăm email, báo cáo mỗi ngày mà không bị quá tải.", icon: Target },

        ];

        // --- Components ---
        const CTAButton = ({ text, subtext, onClick, variant = 'primary', type = 'button', disabled = false, isLoading = false, className = '' }) => {
            const baseClasses = `w-full md:w-auto font-bold uppercase tracking-wide py-4 px-8 rounded-full shadow-xl transform transition-all hover:scale-105 active:scale-95 flex flex-col items-center justify-center text-center disabled:opacity-70 disabled:cursor-not-allowed ${className}`;
            const variants = {
                primary: "bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-red-900 border-b-4 border-yellow-700",
                secondary: "bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white border-b-4 border-red-900",
                white: "bg-white hover:bg-gray-50 text-red-600 border-b-4 border-gray-200"
            };
            return (
                <button onClick={onClick} type={type} disabled={disabled} className={`${baseClasses} ${variants[variant]}`}>
                    {isLoading ? (
                        <span className="flex items-center gap-2"><Loader className="animate-spin" size={24} /> Đang xử lý...</span>
                    ) : (
                        <React.Fragment>
                            <span className="text-xl md:text-2xl flex items-center gap-2">{text} <ArrowRight size={24} /></span>

            );
        };

        const Section = ({ children, className = "", id = "", maxWidth = "max-w-5xl" }) => (

                setIsSubmitting(true);
                const formData = new FormData(e.target);

                formData.append('tags', 'Coaching 1 Year');

                    await fetch(WEBHOOK_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: formData
                    });
                    setIsSuccess(true);
                    setTimeout(() => {
                        window.location.href = PAYMENT_PAGE;
                    }, 800);
                } catch (error) {
                    console.error("Submission error:", error);
                    window.location.href = PAYMENT_PAGE;
                }

                document.getElementById('checkout-section').scrollIntoView({ behavior: 'smooth' });

                            <div className="absolute inset-0 bg-gradient-to-b from-gray-900/95 via-gray-900/80 to-gray-900"></div>
                        </div>

                        <div className="relative z-10 max-w-5xl mx-auto text-center px-4">
                            <div className="inline-flex items-center gap-2 bg-yellow-500 text-red-900 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-6 shadow-lg animate-fade-in-up border border-yellow-400">
                                <Sparkles size={14} /> Mã SP: COACH1Y-AI | Chương trình Đồng hành Trực tiếp
                            </div>
                            
                            <h1 className="flex flex-col items-center justify-center font-extrabold mb-6 drop-shadow-xl tracking-tight">
                                <span className="text-3xl md:text-5xl leading-tight mb-2 block text-gray-100">
                                    ĐỒNG HÀNH 1 NĂM CHUYÊN SÂU
                                </span>
                                <span className="text-3xl md:text-5xl lg:text-6xl text-yellow-400 leading-tight block uppercase mt-2">
                                    ĐỘT PHÁ NĂNG LỰC VỚI <br/> SPEED READING & AI
                                </span>
                            </h1>
                            
                            <p className="text-lg md:text-xl text-gray-300 mb-8 max-w-3xl mx-auto leading-relaxed font-light">
                                Kính chào quý anh chị. Đây không chỉ là một khóa học, mà là hành trình <strong>thay đổi toàn diện năng lực nội tại</strong>. Tiết kiệm hàng ngàn giờ học tập, làm việc hiệu quả và tự tin vượt qua mọi áp lực thi cử, công việc.
                            </p>

                                <CTAButton 
                                    text="ĐĂNG KÝ XÈT DUYỆT NGAY" 
                                    subtext="Chỉ 5.000.000đ cho 1 năm đồng hành liên tục"
                                    variant="primary"

                                <p className="text-gray-600 mb-6 text-lg">

                                        </div>

                                    <li className="flex items-start bg-gray-50 p-3 rounded-lg border border-gray-100">
                                        <Target className="text-red-500 mr-3 flex-shrink-0 mt-1" />
                                        <div>
                                            <span className="font-bold text-gray-900">Công việc ngập đầu:</span>

                                        <h3 className="font-bold text-xl text-gray-800">Quyền lợi của quý khách hàng:</h3>

                                        <CheckCircle className="text-green-500" size={24}/>
                                        <span className="font-bold">Chi phí: 5.000.000đ / 1 Năm</span>
                                    </div>
                                    <div className="flex items-center gap-4">

                                        <span className="font-bold">Hỗ trợ qua Zalo: 0899.320.202</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white text-gray-900 p-6 md:p-8 rounded-2xl shadow-2xl">
                                {isSuccess ? (
                                    <div className="text-center py-10 animate-fade-in">
                                        <CheckCircle className="mx-auto text-green-500 mb-6" size={80} />

                                            <div>
                                                <label className="text-xs font-bold uppercase text-gray-600">Email nhận thông tin</label>
                                                <InputField icon={Mail} type="email" name="email" placeholder="email@example.com" required={true} />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold uppercase text-gray-600">Số điện thoại (Có Zalo)</label>
                                                <InputField icon={Phone} type="tel" name="phone" placeholder="090..." required={true} />
                                            </div>
                                        </div>

                                        <div className="mt-8">
                                            <CTAButton 
                                                text="ĐĂNG KÝ & THANH TOÁN" 
                                                subtext="Bảo mật tuyệt đối thông tin khách hàng"
                                                variant="primary"
                                                type="submit"
                                                disabled={isSubmitting}
                                                isLoading={isSubmitting}
                                                className="w-full text-lg shadow-red-900/50"
                                            />
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>

                    <footer className="bg-gray-950 text-gray-500 py-12 text-center text-sm">
                        <p>© 2024 Speed Reading & AI Academy. Mã SP: COACH1Y-AI</p>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
