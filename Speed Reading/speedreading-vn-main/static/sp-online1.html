                                        Sau khi đã có nền tảng, bạn sẽ bước vào chuỗi ngày rèn luyện cường độ cao để hình thành phản xạ tự nhiên và tối ưu hóa tốc độ đọc thực tế.
                                    </p>
                                    <div className="bg-slate-50 p-4 rounded-2xl text-sm mb-6">
                                        <strong className="block text-gray-900 mb-1">⏱️ Thời lượng:</strong>
                                        <span className="text-gray-600">07 buổi học liên tiếp (60 phút mỗi tối). Sẽ nghỉ thứ 7 và chủ nhật.</span>
                                    </div>

                                    <h4 className="font-bold text-gray-900 mb-4 flex items-center gap-2 text-sm md:text-base">
                                        <CheckCircle size={18} className="text-green-600" /> Lộ trình chi tiết từng bước:
                                    </h4>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {[
                                            { step: "1", title: "Khai phá tiềm năng", desc: "Luyện tập kỹ thuật chỉ tay 3-2-1 và mở rộng tầm nhìn để tăng tốc độ xử lý thông tin của đôi mắt." },
                                            { step: "2", title: "Bí thuật đọc cụm từ", desc: "Loại bỏ thói quen đọc thầm, chuyển sang cơ chế nhìn cụm từ giúp não hiểu thông tin trực tiếp." },
                                            { step: "3", title: "Kỹ thuật thấu thị (Skimming)", desc: "Bí quyết nắm trọn cấu trúc và thông điệp của một cuốn sách 300 trang chỉ trong 15-20 phút." },
                                            { step: "4", title: "Hệ thống hóa", desc: "Cách ghi chép khoa học để kiến thức tự \"khắc sâu\" vào bộ não mà không cần học vẹt (Smart Note & Mind Map)." },
                                            { step: "5", title: "Tư duy & Chia sẻ", desc: "Cách chọn sách đúng giá trị và công thức 4 bước để chia sẻ tri thức một cách tự tin, chuyên nghiệp." },
                                            { step: "6", title: "Về đích", desc: "Tổng kết lộ trình, hệ thống hóa kỹ năng và chuyển giao quy trình ứng dụng vĩnh viễn vào cuộc sống." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                                <span className="flex-shrink-0 w-6 h-6 bg-red-100 text-red-700 font-bold text-xs rounded-full flex items-center justify-center">
                                                    {item.step}
                                                </span>
                                                <div>
                                                    <h5 className="font-bold text-gray-900 text-xs md:text-sm mb-1">{item.title}</h5>
                                                    <p className="text-gray-600 text-xs leading-relaxed">{item.desc}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Những điều bạn cần chuẩn bị */}
                            <div className="bg-gradient-to-br from-gray-900 to-slate-900 text-white p-6 md:p-8 rounded-3xl shadow-xl mb-12">
                                <h3 className="text-lg md:text-xl font-bold text-yellow-400 mb-6 flex items-center gap-2">
                                    <AlertTriangle size={24} className="text-yellow-400 shrink-0" />
                                    📌 Những điều bạn cần chuẩn bị:
                                </h3>
                                <p className="text-gray-300 text-sm md:text-base mb-6 leading-relaxed">
                                    Để đạt được kết quả vượt mong đợi (tăng tốc độ đọc lên 3-5 lần), bạn chỉ cần chuẩn bị:
                                </p>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {[
                                        { title: "Sự tập trung", desc: "Có mặt đúng giờ và tham gia đầy đủ các buổi luyện tập." },
                                        { title: "Dụng cụ học tập", desc: "Một cuốn sách yêu thích, sổ tay Smart Note và bút để thực hành ngay tại lớp." },
                                        { title: "Tâm thế sẵn sàng", desc: "Sẵn sàng phá bỏ giới hạn cũ để đón nhận một khả năng phi thường của chính mình." }
                                    ].map((item, i) => (
                                        <div key={i} className="bg-gray-800/60 p-4.5 rounded-2xl border border-gray-700 flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-bold text-white mb-2 flex items-center gap-2 text-sm md:text-base">
                                                    <CheckCircle size={16} className="text-green-400 shrink-0" /> {item.title}
                                                </h4>
                                                <p className="text-gray-400 text-xs md:text-sm leading-relaxed">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Khối Đăng ký cuối cùng */}
                            <div className="text-center bg-white p-6 md:p-8 rounded-3xl border border-gray-200 shadow-md">
                                <h3 className="text-lg md:text-xl font-bold text-gray-900 mb-3">
                                    Bạn đã sẵn sàng để bứt phá cùng Speed Reading?
                                </h3>
                                <p className="text-gray-500 text-sm md:text-base mb-6">
                                    Đăng ký ngay để bắt đầu hành trình của bạn!
                                </p>
                                <button 
                                    onClick={scrollToCheckout} 
                                    className="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-8 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all text-sm md:text-base uppercase"
                                >
                                    Đăng Ký Ngay <ArrowRight size={18} />
                                </button>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-gray-950 text-gray-600 py-12 text-center text-sm border-t border-gray-900">
                        <p className="mb-2">© 2026 Speed Reading Academy Việt Nam.</p>
                        <p>Hotline: 0899.320.202 | support@speedreading.vn</p>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
