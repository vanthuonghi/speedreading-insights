                                        <div className="bg-white rounded-2xl md:rounded-3xl p-6 md:p-8 ml-6 sm:ml-8 shadow-md border border-slate-100/80 hover:shadow-xl hover:border-slate-200 transition-all duration-300 relative overflow-hidden">
                                            {/* Đường sọc màu đầu thẻ tương ứng buổi học */}
                                            <div className={`absolute top-0 left-0 w-full h-[4px] bg-gradient-to-r ${item.color}`}></div>
                                            
                                            {/* Tiêu đề thẻ và nhãn phụ */}
                                            <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] sm:text-xs font-bold uppercase px-2.5 py-1 rounded-md tracking-wider bg-gradient-to-r ${item.color} text-white shadow-sm`}>
                                                        {item.badge}
                                                    </span>
                                                    <span className="text-[10px] sm:text-xs text-gray-400 font-semibold flex items-center gap-1">
                                                        <Clock size={12} /> Coaching Zoom Trực Tiếp
                                                    </span>
                                                </div>
                                                <span className="text-[10px] sm:text-xs font-extrabold text-slate-300 tracking-wide">
                                                    SPEED READING ACADEMY
                                                </span>
                                            </div>

                                            {/* Tiêu đề chính */}
                                            <h3 className="text-lg sm:text-xl md:text-2xl font-extrabold text-gray-900 group-hover:text-blue-600 transition-colors duration-300 mb-2">
                                                {item.day}: {item.title}
                                            </h3>

                                            {/* Mô tả chi tiết */}
                                            <p className="text-gray-600 text-xs sm:text-sm md:text-base leading-relaxed mb-4">
                                                {item.desc}
                                            </p>

                                            {/* Thẻ Hashtag / Tên bài tập chính */}
                                            <div className="flex flex-wrap gap-1.5 mb-4">
                                                {item.tags && item.tags.map((tag, tagIdx) => (
                                                    <span key={tagIdx} className="text-[10px] sm:text-xs bg-slate-50 text-slate-600 px-2.5 py-1 rounded-full font-medium border border-slate-100">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>

                                            {/* Khung Thành Tựu/Đầu Ra thực hành */}
                                            <div className="bg-emerald-50/70 border border-emerald-100 rounded-xl p-3 sm:p-4 flex items-start gap-2.5">
                                                <div className="bg-emerald-500 rounded-full p-0.5 shrink-0 mt-0.5">
                                                    <CheckCircle size={14} className="text-white fill-current" />
                                                </div>
                                                <div>
                                                    <span className="block text-[10px] font-bold text-emerald-800 uppercase tracking-wider mb-0.5">CAM KẾT ĐẦU RA</span>
                                                    <span className="text-xs sm:text-sm text-emerald-700 font-semibold">
                                                        {item.outcome}
                                                    </span>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </Section>

                    {/* Zalo Support Section */}
                    <Section className="bg-blue-900 text-white rounded-none md:rounded-[3rem] my-10 py-20 overflow-hidden relative">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                            <img src="https://www.transparenttextures.com/patterns/cubes.png" alt="bg" />
                        </div>
                        <div className="grid md:grid-cols-2 gap-10 items-center relative z-10">
                            <div>
                                <h2 className="text-3xl md:text-4xl font-extrabold mb-6 leading-tight">
                                    Đồng Hành Sát Sao <br/> Qua Nhóm Zalo Kín
                                </h2>
                                <p className="text-blue-100 text-lg mb-8 leading-relaxed">
                                    Học trên Zoom là khởi đầu, rèn luyện hàng ngày mới tạo nên kỹ năng. Quý anh chị sẽ được tham gia cộng đồng Zalo để:
                                </p>
                                <ul className="space-y-4">
                                    {[
                                        "Gửi bài tập và được giảng viên sửa lỗi mỗi ngày.",
                                        "Giải đáp thắc mắc ngay lập tức trong quá trình đọc sách thực tế.",
                                        "Nhận tài liệu, ebook và công cụ hỗ trợ đọc nhanh độc quyền.",
                                        "Kết nối cùng cộng đồng những người ham học hỏi và thăng tiến."
                                    ].map((text, i) => (
                                        <li key={i} className="flex items-start gap-3">
                                            <div className="bg-blue-500 rounded-full p-1 mt-1"><CheckCircle size={16} /></div>
                                            <span>{text}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="bg-white p-4 rounded-3xl shadow-2xl rotate-2">
                                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80" alt="Zalo Group Support" className="rounded-2xl w-full" />
                            </div>
                        </div>
                    </Section>

                    {/* Learning Phases Summary Section */}
                    <LearningPhases />

                    {/* Value Stack & Price */}
                    <Section id="pricing">
                        <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-200 overflow-hidden">
                            <div className="bg-red-700 text-white p-8 text-center">
                                <h3 className="text-2xl font-bold uppercase tracking-widest mb-2">Ưu Đãi Đặc Biệt Cho Khoá Zoom</h3>
                                <p className="opacity-80">Đầu tư một lần - Sử dụng kỹ năng trọn đời</p>
                            </div>
                            <div className="p-8">
                                <div className="space-y-4 mb-8">
                                    <div className="flex justify-between items-center py-3 border-b border-gray-100">
                                        <span className="flex items-center gap-2"><Video className="text-blue-600" size={20}/> 7 Buổi Zoom Coaching Trực Tiếp</span>
                                        <span className="font-bold text-gray-400 line-through">2.500.000đ</span>
                                    </div>
                                    <div className="flex justify-between items-center py-3 border-b border-gray-100">
                                        <span className="flex items-center gap-2"><MessageCircle className="text-green-600" size={20}/> Hỗ trợ rèn luyện qua Zalo</span>
                                        <span className="font-bold text-gray-400 line-through">1.000.000đ</span>
                                    </div>
                                    <div className="flex justify-between items-center py-3 border-b border-gray-100">
                                        <span className="flex items-center gap-2"><Gift className="text-purple-600" size={20}/> Bộ tài liệu rèn luyện & Ebook</span>
                                        <span className="font-bold text-gray-400 line-through">500.000đ</span>
                                    </div>
                                    <div className="flex justify-between items-center py-3 text-red-600 font-bold bg-red-50 px-4 rounded-lg">
                                        <span className="flex items-center gap-2"><Trophy size={20}/> Quà tặng: Buổi sửa lỗi 1:1 cho 5 khách hàng đầu tiên</span>
                                        <span>VÔ GIÁ</span>
                                    </div>
                                </div>
                                
                                <div className="text-center">
                                    <p className="text-gray-500 mb-1">Tổng giá trị chương trình: <span className="line-through">4.000.000đ</span></p>
                                    <div className="text-5xl font-black text-red-600 mb-6 tracking-tight">980.000đ</div>
                                    
                                    <div className="animate-pulse-urgent py-2 px-4 rounded-lg inline-block font-bold mb-6">
                                        CHỈ CÒN 5 SUẤT ƯU ĐÃI CUỐI CÙNG
                                    </div>
                                    
                                    <button onClick={scrollToCheckout} className="w-full bg-yellow-400 hover:bg-yellow-300 text-red-900 font-bold py-5 rounded-full shadow-xl border-b-4 border-yellow-600 text-xl uppercase transition-transform hover:scale-105 active:scale-95">
                                        ĐĂNG KÝ NGAY HÔM NAY
                                    </button>
                                </div>
                            </div>
                        </div>
                    </Section>

                    {/* Checkout Section */}
                    <div id="checkout-section" className="py-20 px-4 bg-gray-900 text-white border-t-8 border-yellow-500">
                        <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-extrabold text-yellow-400 mb-6 uppercase leading-tight">Bắt Đầu <br/> Hành Trình Ngay</h2>
                                <p className="text-gray-300 text-lg mb-8">Quý anh chị vui lòng điền chính xác thông tin để chúng tôi gửi lời mời vào nhóm Zoom và Zalo hỗ trợ.</p>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3"><CheckCircle className="text-green-500" /> <span>Hoàn tiền nếu không hài lòng sau buổi 1.</span></div>
                                    <div className="flex items-center gap-3"><CheckCircle className="text-green-500" /> <span>Hỗ trợ trọn đời ngay cả khi kết thúc khóa học.</span></div>
                                </div>
                            </div>

                            <div className="bg-white text-gray-900 p-8 rounded-3xl shadow-2xl">
                                {isSuccess ? (
                                    <div className="text-center py-10">
                                        <CheckCircle className="mx-auto text-green-500 mb-4" size={64} />
                                        <h3 className="text-2xl font-bold mb-2">Đăng Ký Thành Công!</h3>
                                        <p>Đang chuyển hướng quý anh chị đến trang thanh toán...</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleFormSubmit} className="space-y-4">
                                        <div className="text-center mb-6 text-red-700">
                                            <h3 className="text-xl font-bold uppercase">Form Đăng Ký Giữ Chỗ</h3>
                                            <p className="text-xs font-medium">Lớp Zoom giới hạn số lượng học viên</p>
                                        </div>
                                        
                                        <div>
                                            <label className="text-xs font-bold uppercase text-gray-500 ml-1">Họ và tên quý anh chị</label>
                                            <div className="relative mt-1">
                                                <User className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                                <input type="text" name="first_name" required placeholder="Ví dụ: Nguyễn Văn A" className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-yellow-400 outline-none" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold uppercase text-gray-500 ml-1">Địa chỉ Email</label>
                                            <div className="relative mt-1">
                                                <Mail className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                                <input type="email" name="email" required placeholder="email@gmail.com" className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-yellow-400 outline-none" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold uppercase text-gray-500 ml-1">Số điện thoại (Zalo)</label>
                                            <div className="relative mt-1">
                                                <Phone className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                                <input type="tel" name="phone" required placeholder="09xx xxx xxx" className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-yellow-400 outline-none" />
                                            </div>
                                        </div>

                                        <button disabled={isSubmitting} className="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4 flex items-center justify-center gap-2 hover:bg-red-700 transition-colors">
                                            {isSubmitting ? <Loader className="animate-spin" /> : "XÁC NHẬN ĐĂNG KÝ & THANH TOÁN"}
                                        </button>
                                        
                                        <p className="text-[10px] text-gray-400 text-center mt-4">Thông tin của quý khách được bảo mật tuyệt đối theo quy định.</p>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>

                    <footer className="bg-gray-950 text-gray-600 py-12 text-center text-sm border-t border-gray-900">
                        <p className="mb-2">© 2024 Speed Reading Academy Việt Nam.</p>
                        <p>Hotline: 0899.320.202 | support@speedreading.vn</p>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
