<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center V5.0 - Hỉ Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .input-focus:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .book-tag { transition: all 0.2s; cursor: pointer; }
        .book-tag:hover { transform: translateY(-2px); }
        .form-wrapper { height: calc(100vh - 120px); min-height: 600px; }
        @media (max-width: 1024px) { .form-wrapper { height: 700px; } }
        /* Loading animation */
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #4f46e5; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased flex flex-col h-screen overflow-hidden">

    <header class="glass-panel shadow-sm border-b border-gray-200 z-10 sticky top-0">
        <div class="max-w-[1800px] mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">H</div>
                <h1 class="hidden md:block font-extrabold text-xl tracking-tight text-gray-900">Văn Hỉ <span class="text-indigo-600 font-medium">Workspace</span></h1>
            </div>
            
            <div class="flex items-center gap-3 md:gap-6">
                <div class="flex items-center bg-gray-100 rounded-full px-3 py-1.5 shadow-inner">
                    <button onclick="toggleMusic()" id="musicBtn" class="text-gray-500 hover:text-indigo-600 transition-colors flex items-center gap-2 text-sm font-semibold">
                        <span id="musicIcon">🎧</span> <span id="musicText" class="hidden sm:inline">Lofi Chill</span>
                    </button>
                    <div class="hidden" id="youtubePlayer"></div>
                </div>

                <div class="flex items-center bg-indigo-50 border border-indigo-100 rounded-full px-4 py-1.5 shadow-sm">
                    <span id="timerDisplay" class="font-bold text-indigo-700 text-lg tabular-nums">25:00</span>
                    <div class="ml-3 flex gap-1 border-l border-indigo-200 pl-3">
                        <button onclick="startTimer()" class="text-indigo-600 hover:text-indigo-800" title="Bắt đầu">▶️</button>
                        <button onclick="resetTimer()" class="text-gray-400 hover:text-red-500" title="Reset">⏹️</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto max-w-[1800px] w-full mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
            
            <div class="lg:col-span-5 flex flex-col gap-5 overflow-y-auto pb-10 pr-2">
                
                <div class="glass-panel rounded-2xl shadow-sm p-5 border-l-4 border-emerald-500">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-gray-800 text-sm uppercase">📌 Chọn Sách</h2>
                        <select id="audienceSelect" onchange="generateDailyMenu()" class="text-xs bg-gray-50 border border-gray-200 rounded-lg p-1.5 font-semibold text-gray-600 outline-none">
                            <option value="nguoi_di_lam">Người đi làm</option>
                            <option value="kinh_doanh">Kinh doanh</option>
                            <option value="gia_dinh">Gia đình</option>
                        </select>
                    </div>
                    <div id="bookSuggestList" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="glass-panel rounded-2xl shadow-sm p-5 border-l-4 border-indigo-600">
                    <h2 class="font-bold text-gray-800 text-sm uppercase mb-4">🚀 Trạm Xử Lý Content</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <input type="text" id="bookNameInput" oninput="syncToForm()" placeholder="Tên sách (Ví dụ: Thói quen nguyên tử)..." 
                                   class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 font-bold text-base shadow-sm input-focus bg-white">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-orange-600">🛒 Shopee Link</span>
                                    <div class="flex gap-1">
                                        <a id="shopeeSearchBtn" target="_blank" href="#" class="text-[10px] bg-white px-2 py-1 rounded border border-orange-200 text-orange-600 hover:bg-orange-100">Tìm</a>
                                        <a href="https://affiliate.shopee.vn/offer/custom_link" target="_blank" class="text-[10px] bg-orange-500 px-2 py-1 rounded text-white hover:bg-orange-600">Tạo Link</a>
                                    </div>
                                </div>
                                <input type="text" id="shopeeLinkInput" oninput="syncToForm()" placeholder="Dán link Affiliate rút gọn..." class="w-full p-2.5 text-xs border border-orange-200 rounded-lg input-focus bg-white shadow-sm">
                            </div>

                            <div class="bg-red-50/50 p-4 rounded-xl border border-red-100">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-red-600">▶️ YouTube Review</span>
                                    <a id="ytSearchBtn" target="_blank" href="#" class="text-[10px] bg-red-600 px-2 py-1 rounded text-white hover:bg-red-700">Tìm Video</a>
                                </div>
                                <input type="text" id="youtubeLinkInput" oninput="syncToForm()" placeholder="Dán link video Youtube..." class="w-full p-2.5 text-xs border border-red-200 rounded-lg input-focus bg-white shadow-sm">
                            </div>
                        </div>

                        <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-blue-700">🧠 Content Review AI (Trực Tiếp)</span>
                                <button id="generateAiBtn" onclick="generateWithGemini()" class="text-[10px] font-bold bg-blue-600 px-3 py-1.5 rounded text-white hover:bg-blue-700 shadow-sm transition-all flex items-center gap-1">
                                    Tạo Content ⚡
                                </button>
                            </div>
                            <textarea id="reviewContentInput" oninput="syncToForm()" rows="10" placeholder="Bấm nút 'Tạo Content ⚡' để AI tự động tổng hợp thông tin sách, phân tích insight và viết tóm tắt ngay tại đây..." class="w-full p-3 text-xs border border-blue-200 rounded-lg input-focus bg-white shadow-sm resize-none"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 h-full hidden lg:block">
                <div class="glass-panel rounded-2xl shadow-xl overflow-hidden flex flex-col form-wrapper border border-gray-200">
                    <div class="bg-gray-900 text-white px-4 py-2 flex justify-between items-center text-xs">
                        <span class="font-bold tracking-wider opacity-80">FORM AUTO-SYNC</span>
                        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live</span>
                    </div>
                    <iframe id="googleFormIframe" src="https://docs.google.com/forms/d/e/1FAIpQLScu3spdM5lToW_sYKj0ZK62bOX3CGJM58YzvUrctUU4rHOO-g/viewform?embedded=true" class="w-full flex-1 border-0" title="Google Form"></iframe>
                </div>
            </div>

            <div class="lg:hidden fixed bottom-6 right-6">
                <button onclick="document.getElementById('mobileForm').classList.toggle('hidden')" class="w-14 h-14 bg-indigo-600 rounded-full text-white shadow-2xl flex items-center justify-center text-2xl hover:bg-indigo-700 transition-transform active:scale-95">📝</button>
            </div>
            
            <div id="mobileForm" class="hidden lg:hidden fixed inset-0 z-50 bg-gray-900/50 backdrop-blur-sm p-4 pt-20">
                <div class="bg-white w-full h-full rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">
                    <button onclick="document.getElementById('mobileForm').classList.add('hidden')" class="absolute top-2 right-4 text-gray-500 text-3xl z-10">&times;</button>
                    <div class="bg-gray-100 px-4 py-3 text-center text-sm font-bold text-gray-700 border-b">Preview Form</div>
                    <iframe id="googleFormIframeMobile" src="https://docs.google.com/forms/d/e/1FAIpQLScu3spdM5lToW_sYKj0ZK62bOX3CGJM58YzvUrctUU4rHOO-g/viewform?embedded=true" class="w-full flex-1 border-0"></iframe>
                </div>
            </div>

        </div>
    </main>

    <script>
        const apiKey = ""; // API Key môi trường tự cấp
        
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScu3spdM5lToW_sYKj0ZK62bOX3CGJM58YzvUrctUU4rHOO-g/viewform";
        const ENTRIES = {
            bookName: 'entry.525534056', review: 'entry.1886863981',
            youtube: 'entry.913333326', shopee: 'entry.1217974501'
        };

        const dbBooks = {
            "nguoi_di_lam": ["Thói Quen Nguyên Tử", "Sức Mạnh Tiềm Thức", "Làm Việc Sâu", "Tư Duy Nhanh Và Chậm"],
            "kinh_doanh": ["Nhà Giả Kim", "Cha Giàu Cha Nghèo", "Bí Mật DotCom", "Khởi Nghiệp Tinh Gọn"],
            "gia_dinh": ["Kỷ Luật Không Nước Mắt", "Nhân Tố Enzyme", "Lối Sống Tối Giản"]
        };

        function syncToForm() {
            const data = {
                name: document.getElementById('bookNameInput').value,
                review: document.getElementById('reviewContentInput').value,
                yt: document.getElementById('youtubeLinkInput').value,
                shopee: document.getElementById('shopeeLinkInput').value
            };

            const params = new URLSearchParams();
            if(data.name) params.append(ENTRIES.bookName, data.name);
            if(data.review) params.append(ENTRIES.review, data.review);
            if(data.yt) params.append(ENTRIES.youtube, data.yt);
            if(data.shopee) params.append(ENTRIES.shopee, data.shopee);

            const finalUrl = `${FORM_URL}?${params.toString()}&embedded=true`;
            document.getElementById('googleFormIframe').src = finalUrl;
            document.getElementById('googleFormIframeMobile').src = finalUrl;
            
            updateLinks(data.name);
        }

        function updateLinks(bookName) {
            if(!bookName) return;
            document.getElementById('shopeeSearchBtn').href = `https://shopee.vn/search?keyword=${encodeURIComponent(bookName)}`;
            document.getElementById('ytSearchBtn').href = `https://www.youtube.com/results?search_query=${encodeURIComponent('Review sách ' + bookName)}`;
        }

        // --- GEMINI AI GENERATOR ---
        async function generateWithGemini() {
            const bookName = document.getElementById('bookNameInput').value.trim();
            if (!bookName) {
                alert("Hỉ ơi, vui lòng nhập Tên Sách trước khi tạo Content nhé!");
                document.getElementById('bookNameInput').focus();
                return;
            }

            const btn = document.getElementById('generateAiBtn');
            const contentBox = document.getElementById('reviewContentInput');
            
            // UI Loading state
            btn.innerHTML = `<span class="loader"></span> Đang xử lý...`;
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-blue-400');
            contentBox.value = "AI đang đọc sách và tổng hợp nội dung cho Hỉ...\nVui lòng chờ trong giây lát (khoảng 5-10 giây)...";

            const systemPrompt = `Đóng vai một chuyên gia tóm tắt sách và làm SEO chuyên nghiệp. Hãy tìm kiếm từ nhiều nguồn dữ liệu uy tín để tổng hợp thông tin chi tiết, chính xác nhất về cuốn sách "${bookName || '[Tên Sách]'}". 

Yêu cầu định dạng và nội dung bắt buộc:
1. Thông tin chuẩn xác: Tên sách gốc, Tên tác giả, Năm xuất bản.
2. Tóm tắt nội dung: Viết một đoạn giới thiệu chuẩn SEO (chứa từ khóa tên sách), liệt kê cấu trúc các phần/chương chính của sách.
3. Giá trị cốt lõi: Rút ra 3-5 bài học hoặc lợi ích thực tế đắt giá nhất, trích xuất đúng từ nội dung sách.
4. Đánh giá khách quan: Cuốn sách này thực sự giải quyết vấn đề gì và dành cho đối tượng độc giả nào.

Hãy trình bày súc tích, chia gạch đầu dòng rõ ràng. Đảm bảo 100% thông tin đúng sự thật và đúng nguyên tác`;

            const userQuery = `Hãy dùng trí tuệ của bạn để đọc và phân tích cực sâu cuốn sách: "${bookName}". Moi hết giá trị tinh túy nhất ra cho tôi.`;

            // Setup Exponential Backoff for stability
            let retries = 0;
            const maxRetries = 3;
            const delays = [1000, 2000, 4000];
            let finalResult = null;

            while (retries <= maxRetries && !finalResult) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error("API responded with an error");
                    
                    const result = await response.json();
                    finalResult = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!finalResult) throw new Error("No text found in response");

                } catch (error) {
                    if (retries === maxRetries) {
                        contentBox.value = "⚠️ Lỗi kết nối AI. Hỉ hãy thử bấm tạo lại lần nữa nhé!";
                        console.error(error);
                        break;
                    }
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }

            // Restore UI
            if (finalResult) {
                contentBox.value = finalResult.trim();
                syncToForm(); // Auto sync the new content to the Google Form!
            }
            btn.innerHTML = "Tạo Content ⚡";
            btn.disabled = false;
            btn.classList.replace('bg-blue-400', 'bg-blue-600');
        }

        function generateDailyMenu() {
            const aud = document.getElementById('audienceSelect').value;
            const books = dbBooks[aud] || [];
            document.getElementById('bookSuggestList').innerHTML = books.map(b => `<span onclick="document.getElementById('bookNameInput').value='${b}'; syncToForm();" class="book-tag bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm">${b}</span>`).join('');
        }

        // --- POMODORO TIMER ---
        let timerInterval;
        let timeLeft = 25 * 60;
        let isRunning = false;
        
        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); } 
                else { resetTimer(); alert("Hết 25 phút! Bạn nên nghỉ mắt 5 phút nhé."); }
            }, 1000);
        }
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        // --- MUSIC PLAYER ---
        let isMusicPlaying = false;
        function toggleMusic() {
            const playerDiv = document.getElementById('youtubePlayer');
            const icon = document.getElementById('musicIcon');
            const btn = document.getElementById('musicBtn');
            
            if(!isMusicPlaying) {
                playerDiv.innerHTML = `<iframe width="10" height="10" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=0" allow="autoplay"></iframe>`;
                icon.innerText = "⏸️";
                btn.classList.add('text-indigo-600');
                isMusicPlaying = true;
            } else {
                playerDiv.innerHTML = "";
                icon.innerText = "🎧";
                btn.classList.remove('text-indigo-600');
                isMusicPlaying = false;
            }
        }

        window.onload = () => { generateDailyMenu(); updateTimerDisplay(); };
    </script>
</body>
</html>
