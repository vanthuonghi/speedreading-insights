<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <!-- Điểm gắn ứng dụng React -->

    <!-- Mã nguồn React được viết tự nhiên không cần bọc khối Hugo safeHTML -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Calendar, Clock, User, Mail, Phone, ArrowRight, CheckCircle2, 
            PlayCircle, Award, Users, BookOpen, AlertCircle, Sparkles, 
            Zap, Heart, Share2, Camera, ShieldCheck, ChevronRight, Star, Loader2
        } from 'lucide-react';

        const CountdownTimer = () => {
            const [timeLeft, setTimeLeft] = useState({ minutes: 14, seconds: 59 });
            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
                        if (prev.minutes > 0) return { minutes: prev.minutes - 1, seconds: 59 };
                        return { minutes: 15, seconds: 0 };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex gap-3 justify-center md:justify-start items-center">
                    <div className="text-center">
                        <div className="bg-white/10 backdrop-blur-md text-white w-14 h-14 flex items-center justify-center rounded-xl text-xl font-bold border border-white/20 shadow-lg">
                            {String(timeLeft.minutes).padStart(2, '0')}
                        </div>
                        <span className="text-[10px] font-bold uppercase text-white/50 mt-1 block tracking-wider">Phút</span>
                    </div>
                    <div className="text-amber-400 font-bold text-2xl animate-pulse mb-4">:</div>
                    <div className="text-center">
                        <div className="bg-white/10 backdrop-blur-md text-white w-14 h-14 flex items-center justify-center rounded-xl text-xl font-bold border border-white/20 shadow-lg">
                            {String(timeLeft.seconds).padStart(2, '0')}
                        </div>
                        <span className="text-[10px] font-bold uppercase text-white/50 mt-1 block tracking-wider">Giây</span>
                    </div>
                </div>
            );
        };

        const RegistrationModal = ({ isOpen, onClose }) => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [error, setError] = useState(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setError(null);

                const formData = new FormData(e.target);
                const data = {
                    first_name: formData.get('full_name'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                };

                const webhookUrl = "https://crm.speedreading.vn/?fluentcrm=1&route=contact&hash=5a99cd3e-b4b4-4c98-8756-5507c80b1337";

                try {
                    await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                        mode: 'no-cors'
                    });

                    window.location.href = "https://speedreading.vn/webinar";
                    
                } catch (err) {
                    setError("Có lỗi xảy ra, quý anh chị vui lòng thử lại hoặc liên hệ hỗ trợ.");
                    setIsSubmitting(false);
                }

            return (

                            <p className="text-amber-900 font-medium">Link tham gia sẽ được gửi qua Zalo & Email</p>
                        </div>
                        <form className="p-8 space-y-5" onSubmit={handleSubmit}>
                            {error && (
                                <div className="p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl flex items-center gap-2">
                                    <AlertCircle size={16} /> {error}
                                </div>
                            )}

                                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">Họ tên của quý anh chị</label>
                                <div className="relative group">
                                    <User size={18} className="absolute left-4 top-3.5 text-slate-400 group-focus-within:text-amber-500 transition-colors" />
                                    <input required name="full_name" type="text" placeholder="Nhập đầy đủ họ tên..." className="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition-all font-medium" />
                                </div>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">Số điện thoại Zalo</label>
                                <div className="relative group">
                                    <Phone size={18} className="absolute left-4 top-3.5 text-slate-400 group-focus-within:text-amber-500 transition-colors" />
                                    <input required name="phone" type="tel" placeholder="09xx xxx xxx" className="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition-all font-medium" />

                            </div>

                            </button>
                        )}

                                </h1>
                                
                                <p className="text-lg md:text-2xl text-slate-300 font-medium leading-relaxed max-w-2xl">

                                </p>

                                <div className="flex flex-col md:flex-row items-center gap-8 pt-4">
                                    <button 
                                        onClick={() => setIsModalOpen(true)}
                                        className="w-full md:w-auto gold-gradient shimmer text-amber-950 font-black px-10 py-6 rounded-2xl text-xl shadow-[0_20px_50px_rgba(245,158,11,0.3)] transform transition hover:scale-105 active:scale-95 flex items-center justify-center gap-3"
                                    >
                                        ĐĂNG KÝ XEM NGAY <ArrowRight size={24} />
                                    </button>
                                    <div className="flex flex-col items-center md:items-start gap-2">
                                        <p className="text-xs font-bold text-amber-400/80 uppercase tracking-widest">Sắp bắt đầu trong:</p>
                                        <CountdownTimer />
                                    </div>
                                </div>

                                <div className="flex flex-wrap justify-center md:justify-start gap-6 text-sm font-semibold text-slate-400 border-t border-white/10 pt-8">
                                    <span className="flex items-center gap-2 text-white"><CheckCircle2 size={18} className="text-green-400"/> Webinar miễn phí 100%</span>
                                    <span className="flex items-center gap-2"><Users size={18} className="text-amber-500"/> 2.450 quý anh chị tham gia</span>
                                </div>

                            <div className="flex-1 w-full max-w-md relative">

                                    <img 
                                        src="https://img.speedreading.vn/Hinh-van-hi-Speed-Reading.jpg" 
                                        alt="Chuyên gia Văn Hỉ" 
                                        className="w-full h-full object-cover object-top hover:scale-110 transition-transform duration-700"
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                                    <div className="absolute bottom-6 left-6 right-6 p-6 bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 gold-gradient rounded-full flex items-center justify-center text-amber-950">
                                                <PlayCircle size={28} fill="currentColor" />

                                            <div>

                                                <p className="text-amber-400 text-xs font-black uppercase">Speed Reading Expert</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                            <div className="text-center max-w-3xl mx-auto mb-20 space-y-4">
                                <h2 className="text-3xl md:text-5xl font-black text-slate-900 leading-tight">Sách là kho tàng, nhưng quý anh chị có đang bỏ phí?</h2>
                                <p className="text-lg text-slate-500 font-medium">Nếu quý anh chị đang gặp những vấn đề này, webinar này dành riêng cho quý khách hàng.</p>
                                <div className="w-32 h-2 gold-gradient mx-auto rounded-full mt-6"></div>
                            </div>

                            <div className="grid md:grid-cols-3 gap-10">
                                {[
                                    { icon: <AlertCircle className="text-red-500" size={32} />, title: "Mua sách phong trào", desc: "Quý anh chị mua rất nhiều nhưng chỉ đọc được vài trang đầu là... ngủ gục?" },
                                    { icon: <Zap className="text-amber-500" size={32} />, title: "Đọc xong quên ngay", desc: "Quý khách hàng đọc xong trang sau quên ngay trang trước, kiến thức không đọng lại gì?" },
                                    { icon: <Clock className="text-blue-500" size={32} />, title: "Thời gian quá hẹp", desc: "Muốn thăng tiến nhưng công việc ngốn sạch thời gian để quý anh chị có thể cập nhật kiến thức?" }

                                        <div className="bg-white w-20 h-20 flex items-center justify-center rounded-2xl shadow-sm mb-8 group-hover:scale-110 group-hover:bg-amber-50 transition-all">{item.icon}</div>
