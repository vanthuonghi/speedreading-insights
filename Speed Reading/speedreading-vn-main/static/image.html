<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Xử Lý Ảnh WEBP - SpeedReading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .drag-over { background-color: #eff6ff; border-color: #3b82f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased p-6 flex items-center justify-center min-h-screen">

    <div class="glass-panel w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden border border-gray-200 p-8">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-2">🚀 Trạm Nén Ảnh Hàng Loạt WEBP</h2>
        <p class="text-gray-500 text-sm mb-6">Tự động lấy tên file gốc, chuyển sang dạng Slug chuẩn SEO và upload lên img.speedreading.vn</p>

        <!-- Khu vực Kéo Thả -->
        <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-colors cursor-pointer hover:bg-gray-50 mb-6">
            <!-- Thêm thuộc tính multiple để cho phép chọn nhiều file -->
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" class="hidden" multiple>
            <div class="text-4xl mb-2">📥</div>
            <p class="text-gray-600 font-semibold">Kéo thả hàng loạt ảnh vào đây hoặc Click để chọn file</p>
            <p class="text-xs text-gray-400 mt-1">Chuẩn bị sẵn tên file tiếng Việt bên ngoài (VD: Thói quen nguyên tử.jpg)</p>
        </div>

        <!-- Khu vực hiển thị danh sách ảnh -->
        <div id="fileListContainer" class="hidden mb-6 space-y-3 max-h-80 overflow-y-auto pr-2">
            <!-- Dữ liệu được render bằng JS -->
        </div>

        <!-- Khu vực Nút thao tác -->
        <div id="actionArea" class="hidden flex flex-col gap-3">
            <button id="uploadAllBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-colors shadow-md flex justify-center items-center gap-2">
                🚀 Upload Tất Cả Lên Hosting
            </button>
            <button id="copyAllBtn" class="hidden w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition-colors shadow-md flex justify-center items-center gap-2">
                📋 Copy Toàn Bộ Link Ảnh
            </button>
        </div>
    </div>

    <script>
        // CẤU HÌNH API UPLOAD
        const UPLOAD_API_URL = "https://img.speedreading.vn/upload.php";

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const actionArea = document.getElementById('actionArea');
        const uploadAllBtn = document.getElementById('uploadAllBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        
        // Mảng lưu trữ trạng thái các file
        let processedFiles = [];

        // Hàm chuyển đổi Tiếng Việt có dấu sang Slug (Chuẩn SEO)
        function generateSlug(str) {
            str = str.replace(/^\s+|\s+$/g, ''); // Cắt khoảng trắng 2 đầu
            str = str.toLowerCase(); // Chuyển chữ thường
            
            // Xóa dấu tiếng việt
            const from = "àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ·/_,:;";
            const to   = "aaaaaaaaaaaaaaaaaeeeeeeeeeeeiiiiiooooooooooooooooouuuuuuuuuuuyyyyyd------";
            for (let i = 0, l = from.length; i < l; i++) {
                str = str.replace(new RegExp(from.charAt(i), 'g'), to.charAt(i));
            }

            str = str.replace(/[^a-z0-9 -]/g, '') // Xóa các ký tự đặc biệt
                .replace(/\s+/g, '-') // Thay khoảng trắng bằng gạch ngang
                .replace(/-+/g, '-'); // Xóa các dấu gạch ngang liên tiếp

            return str;
        }

        // Xử lý sự kiện kéo thả
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        });
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { 
            if(e.target.files.length) handleFiles(e.target.files); 
        });

        // Hàm resize và convert sang WebP (Trả về Promise)
        function convertToWebp(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; // Giới hạn chiều rộng
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = height * (MAX_WIDTH / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Nén WEBP chất lượng 80%
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/webp', 0.8);
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Xử lý hàng loạt file
        async function handleFiles(files) {
            fileListContainer.classList.remove('hidden');
            actionArea.classList.remove('hidden');

            for (let file of files) {
                if (!file.type.match('image.*')) continue;

                // Tách tên file và tạo Slug
                let originalName = file.name;
                let baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
                let finalName = generateSlug(baseName) + '.webp';

                // Tránh add trùng file
                if (processedFiles.some(f => f.originalName === originalName)) continue;

                let fileObj = {
                    id: Date.now() + Math.random(),
                    originalName: originalName,
                    finalName: finalName,
                    blob: null,
                    previewUrl: '',
                    status: 'processing', // processing, ready, uploading, success, error
                    hostedUrl: ''
                };
                
                processedFiles.push(fileObj);
                renderFileList();

                try {
                    // Chờ nén ảnh xong
                    let webpBlob = await convertToWebp(file);
                    fileObj.blob = webpBlob;
                    fileObj.previewUrl = URL.createObjectURL(webpBlob);
                    fileObj.status = 'ready';
                } catch(e) {
                    fileObj.status = 'error';
                }
                renderFileList();
            }
        }

        // Cập nhật giao diện danh sách
        function renderFileList() {
            fileListContainer.innerHTML = '';
            
            processedFiles.forEach(fileObj => {
                let statusBadge = '';
                if (fileObj.status === 'processing') statusBadge = '<span class="text-xs font-bold text-gray-500">⏳ Đang nén...</span>';
                if (fileObj.status === 'ready') statusBadge = '<span class="text-xs font-bold text-indigo-600">✅ Sẵn sàng</span>';
                if (fileObj.status === 'uploading') statusBadge = '<span class="text-xs font-bold text-orange-500">🚀 Đang up...</span>';
                if (fileObj.status === 'success') statusBadge = '<span class="text-xs font-bold text-emerald-600">✔️ Xong</span>';
                if (fileObj.status === 'error') statusBadge = '<span class="text-xs font-bold text-red-600">❌ Lỗi</span>';

                let urlDisplay = fileObj.status === 'success' ? 
                    `<a href="${fileObj.hostedUrl}" target="_blank" class="text-xs text-blue-500 underline truncate block w-48">${fileObj.hostedUrl}</a>` : '';

                const itemHtml = `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex-shrink-0 overflow-hidden flex items-center justify-center border border-gray-200">
                            ${fileObj.previewUrl ? `<img src="${fileObj.previewUrl}" class="w-full h-full object-cover">` : '<span class="text-xl">⏳</span>'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs text-gray-400 line-through truncate mb-1" title="${fileObj.originalName}">${fileObj.originalName}</p>
                            <p class="text-sm font-bold text-gray-800 truncate" title="${fileObj.finalName}">${fileObj.finalName}</p>
                            ${urlDisplay}
                        </div>
                        <div class="w-24 text-right">
                            ${statusBadge}
                        </div>
                    </div>
                `;
                fileListContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // Xử lý Upload Hàng Loạt
        uploadAllBtn.addEventListener('click', async () => {
            uploadAllBtn.innerHTML = "⏳ Hệ thống đang đẩy ảnh lên...";
            uploadAllBtn.disabled = true;
            copyAllBtn.classList.add('hidden');

            for (let fileObj of processedFiles) {
                if (fileObj.status !== 'ready' && fileObj.status !== 'error') continue;

                fileObj.status = 'uploading';
                renderFileList();

                const formData = new FormData();
                formData.append('file', fileObj.blob, fileObj.finalName);
                formData.append('filename', fileObj.finalName);

                try {
                    const response = await fetch(UPLOAD_API_URL, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if(result.status === 'success') {
                        fileObj.status = 'success';
                        fileObj.hostedUrl = result.url;
                    } else {
                        fileObj.status = 'error';
                    }
                } catch (error) {
                    fileObj.status = 'error';
                }
                renderFileList();
            }

            // Kiểm tra xem có file nào upload thành công không để hiện nút Copy
            const hasSuccess = processedFiles.some(f => f.status === 'success');
            if(hasSuccess) {
                uploadAllBtn.innerHTML = "✅ Hoàn Tất Upload!";
                copyAllBtn.classList.remove('hidden');
            } else {
                uploadAllBtn.innerHTML = "❌ Lỗi Upload, Vui lòng thử lại";
                uploadAllBtn.disabled = false;
            }
        });

        // Nút Copy toàn bộ link
        copyAllBtn.addEventListener('click', () => {
            const links = processedFiles
                .filter(f => f.status === 'success')
                .map(f => f.hostedUrl)
                .join('\n');
            
            if (links) {
                navigator.clipboard.writeText(links);
                copyAllBtn.innerHTML = "✅ Đã Copy Tất Cả Link!";
                setTimeout(() => {
                    copyAllBtn.innerHTML = "📋 Copy Toàn Bộ Link Ảnh";
                }, 3000);
            }
        });

    </script>
</body>
</html>
