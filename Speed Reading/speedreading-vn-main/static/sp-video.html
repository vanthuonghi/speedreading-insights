<body>

                <button onClick={onClick} type={type} disabled={disabled} className={`${baseClasses} ${variants[variant]}`}>

                        </div>

                            </div>
                            
                            <h1 className="flex flex-col items-center justify-center font-extrabold mb-6 drop-shadow-xl tracking-tight">

                                <span className="text-4xl md:text-6xl lg:text-7xl text-yellow-400 leading-tight block uppercase">

                                </span>
                            </h1>
                            
                            <p className="text-lg md:text-xl text-gray-300 mb-8 max-w-3xl mx-auto leading-relaxed font-light">

                            </p>

                                        </div>

                                            <span className="font-bold text-gray-900">Chi phí cực kỳ tối ưu:</span>
                                            <p className="text-sm text-gray-500">Chỉ 200.000đ - bằng một bữa ăn sáng - quý anh chị đã sở hữu kỹ năng đi cùng suốt đời.</p>

                                                <Download size={20} className="text-green-600"/>
                                                <span className="font-medium text-sm md:text-base">Bộ tài liệu thực hành PDF</span>
                                            </div>
                                            <span className="text-sm font-bold text-gray-400 line-through">500.000đ</span>
                                        </li>
                                        <li className="flex items-center justify-between p-3 bg-red-50 rounded-lg border border-red-200 shadow-sm">

                                                <CheckCircle size={20} className="text-red-600"/>
                                                <span className="font-bold text-red-700 text-sm md:text-base">Quyền truy cập học trọn đời</span>

                    {/* 6. CHECKOUT FORM */}
                    <div id="checkout-section" className="py-20 px-4 bg-gray-900 text-white relative overflow-hidden border-t-8 border-yellow-500">
                        <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-10 items-center relative z-10">
                            <div className="text-center md:text-left">
                                <h2 className="text-3xl md:text-5xl font-extrabold mb-4 leading-tight text-yellow-400 italic">Hành động ngay!</h2>
                                <p className="mb-8 text-gray-300 text-lg">Để nhận ngay link truy cập trọn bộ video 17 bài giảng và bộ tài liệu thực hành PDF. Quý anh chị vui lòng điền thông tin bên cạnh.</p>
                                <div className="hidden md:block">
                                    <div className="flex items-center gap-4 mb-4">
                                        <CheckCircle className="text-green-500" size={24}/>
                                        <span className="font-bold text-xl text-white">Chỉ với 200.000đ</span>
                                    </div>
                                    <div className="flex items-center gap-4 mb-4">
                                        <CheckCircle className="text-green-500" size={24}/>
                                        <span className="font-bold text-xl text-white">Sở hữu vĩnh viễn</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white text-gray-900 p-6 md:p-8 rounded-2xl shadow-2xl transform transition-all hover:scale-[1.01]">
                                <form onSubmit={handleFormSubmit}>
                                    <div className="text-center mb-6">
                                        <h3 className="font-extrabold text-2xl text-red-700 uppercase">Thông Tin Đăng Ký</h3>
                                        <p className="text-sm text-gray-500">Hệ thống sẽ gửi link học qua Email quý anh chị</p>
                                    </div>
                                    
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold uppercase text-gray-600 ml-1">Họ và tên quý anh chị</label>
                                        <InputField icon={User} type="text" name="first_name" placeholder="Nguyễn Văn A" required={true} />
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-xs font-bold uppercase text-gray-600 ml-1">Email (nhận bài giảng)</label>
                                        <InputField icon={Mail} type="email" name="email" placeholder="email@example.com" required={true} />
                                    </div>

                                    <div className="space-y-1 mb-6">
                                        <label className="text-xs font-bold uppercase text-gray-600 ml-1">Số điện thoại (Zalo hỗ trợ)</label>
                                        <InputField icon={Phone} type="tel" name="phone" placeholder="0912..." required={true} />
                                    </div>

                                    <div className="pt-2">
                                        <div className="flex justify-between items-center mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                                            <span className="text-gray-600 font-medium">Thanh toán ưu đãi:</span>
                                            <span className="font-extrabold text-red-600 text-3xl leading-none">200.000đ</span>
                                        </div>

                                        <CTAButton 
                                            text="XÁC NHẬN ĐĂNG KÝ" 
                                            subtext="Quý anh chị sẽ được chuyển đến trang thanh toán"
                                            variant="primary"
                                            type="submit"
                                            disabled={isSubmitting}
                                            isLoading={isSubmitting}
                                            className="w-full text-lg shadow-red-900/50"
                                        />
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <footer className="bg-gray-950 text-gray-500 py-12 border-t border-gray-900 relative z-10 text-center text-sm">
                        <p className="mb-2">© 2024 Speed Reading Academy.</p>
                        <p>Kính chúc quý anh chị học tập hiệu quả và thành công.</p>
                        <p className="mt-4">Hotline: 0899.320.202 | Email: support@speedreading.vn</p>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
