<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reading - Skimming Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] },
                    colors: { brand: { red: '#ef4444', darkRed: '#b91c1c', lightRed: '#fecaca', text: '#1e293b' } }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f8fafc; color: #1e293b; user-select: none; }
        
        .panel-3d {
            background: #ffffff; border: 4px solid #ef4444; border-radius: 1.5rem;
            box-shadow: 6px 8px 0px #b91c1c; 
        }

        .btn-3d {
            background: white; color: #1e293b; border: 3px solid #e2e8f0;
            border-bottom: 5px solid #cbd5e1; border-radius: 1rem; font-weight: 800;
            transition: all 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-3d:active { transform: translateY(5px); border-bottom-width: 0px; margin-bottom: 5px; }
        .btn-3d.active { background: #ef4444; color: white; border-color: #b91c1c; border-bottom-color: #7f1d1d; }

        /* =========================================
           CÁC CHẾ ĐỘ HIỂU ỨNG THỊ GIÁC (SKIMMING MODES)
           ========================================= */
        #reader-container { transition: all 0.5s ease; }
        .book-title, .book-subtitle, .sentence-first, .sentence-mid, .sentence-last, .keyword {
            transition: all 0.5s ease;
        }

        /* 1. CHẾ ĐỘ: BỘ XƯƠNG TIÊU ĐỀ (Title Power) */
        /* Toàn bộ chữ mờ đi, chỉ Tiêu đề chính và phụ rực sáng, to lên */
        .mode-title .book-para { opacity: 0.15; filter: blur(3px); }
        .mode-title .book-title { color: #b91c1c; transform: scale(1.05); transform-origin: center; text-shadow: 0 4px 10px rgba(239,68,68,0.2); }
        .mode-title .book-subtitle { color: #ef4444; transform: scale(1.02); transform-origin: left; background: #fee2e2; padding: 2px 10px; border-radius: 8px; border-left: 4px solid #b91c1c;}

        /* 2. CHẾ ĐỘ: ĐẦU ĐUÔI (Head & Tail) */
        /* Giữa đoạn bị mờ, Câu đầu và Câu cuối đậm lên */
        .mode-headtail .sentence-mid { opacity: 0.15; filter: blur(3px); }
        .mode-headtail .sentence-first { font-weight: 900; color: #b91c1c; background: linear-gradient(transparent 70%, #fecaca 30%); }
        .mode-headtail .sentence-last { font-weight: 900; color: #0369a1; background: linear-gradient(transparent 70%, #bae6fd 30%); }
        .mode-headtail .book-subtitle { opacity: 0.5; }

        /* 3. CHẾ ĐỘ: BỘ LỌC TỪ KHÓA (Keyword Hunter) */
        /* Toàn bộ văn bản thành màu xám nhạt (kể cả từ nối), chỉ Từ khóa đỏ rực */
        .mode-keyword { color: #cbd5e1; }
        .mode-keyword .book-title, .mode-keyword .book-subtitle { color: #94a3b8; }
        .mode-keyword .keyword { 
            color: #ef4444; font-weight: 900; 
            background: #fee2e2; padding: 2px 4px; border-radius: 4px;
            box-shadow: 0 2px 4px rgba(239,68,68,0.2);
        }

        /* 4. CHẾ ĐỘ: TIA SÉT CHỮ Z (Z-Pattern) */
        /* Tạo một đốm sáng chạy theo hình chữ Z bao trùm văn bản */
        .z-scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; display: none; overflow: hidden;
            border-radius: 1rem;
        }
        .mode-zscan .z-scanner-container { display: block; }
        
        .z-dot {
            position: absolute; width: 40px; height: 40px; background: #ef4444;
            border-radius: 50%; filter: blur(8px);
            box-shadow: 0 0 40px 20px rgba(239,68,68,0.6);
            animation: scanZ 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .z-line {
            position: absolute; width: 100%; height: 6px; background: linear-gradient(90deg, transparent, rgba(239,68,68,0.8), transparent);
            box-shadow: 0 0 20px rgba(239,68,68,0.5); top: -10px;
            animation: scanZLine 3s linear infinite;
        }

        @keyframes scanZ {
            0% { top: 10%; left: 0%; }
            30% { top: 10%; left: 90%; }
            70% { top: 90%; left: 0%; }
            100% { top: 90%; left: 90%; }
        }
        @keyframes scanZLine {
            0% { top: 10%; }
            30% { top: 10%; }
            70% { top: 90%; }
            100% { top: 90%; }
        }
    </style>
</head>

            </div>
        </aside>

    </main>

                        <span class="sentence-first"><span class="keyword">Lắng nghe sâu</span> là một <span class="keyword">món quà</span> quý giá nhất bạn có thể <span class="keyword">trao tặng</span> cho bất kỳ ai.</span>
                        <span class="sentence-mid"> Khi bạn <span class="keyword">nhìn thẳng</span> vào mắt họ, <span class="keyword">gật đầu</span> nhẹ nhàng và duy trì sự <span class="keyword">im lặng</span> tuyệt đối, đối phương sẽ cảm thấy được <span class="keyword">tôn trọng</span>. Lúc đó, họ sẽ tự động <span class="keyword">mở lòng</span> và <span class="keyword">chia sẻ</span> những <span class="keyword">vấn đề</span> cốt lõi nhất giấu kín bên trong.</span>
                        <span class="sentence-last"> Bậc thầy <span class="keyword">thuyết phục</span> không phải người nói nhiều, mà là người biết <span class="keyword">im lặng</span> đúng lúc.</span>
                    </p>
                `
            }
        ];

        const insights = {
            'normal': { t: 'Đọc tự nhiên', d: 'Trạng thái bình thường để kiểm tra tốc độ ban đầu trước khi dùng màng lọc.' },
            'title': { t: 'Nhìn Xương Sống (Outline)', d: 'Phép màu của Skimming! Não bộ lập tức phớt lờ các chữ mờ ảo để thấy rõ "Cấu trúc ý chính" của bài viết thông qua các Tiêu đề rực sáng. Học viên hiểu ngay: Đọc Tiêu đề = Nắm dàn bài!' },
            'headtail': { t: 'Bật Đèn Câu Chốt', d: 'Mô phỏng chính xác thói quen của cao thủ Skimming. Mắt chỉ dừng lại ở Câu Mở (Màu Đỏ) và Câu Kết (Màu Xanh), tự động bỏ qua phần kể lể ở giữa. Nhanh và nắm trọn vẹn ý!' },
            'keyword': { t: 'Gạt Bỏ Từ Rác', d: 'Các từ "và, thì, là, ở, của..." bị tắt điện. Mắt chỉ còn bám vào các viên kim cương màu đỏ (Danh từ & Động từ mạnh). Rèn luyện mắt nhảy cóc không đọc nhẩm từng chữ.' },
            'zscan': { t: 'Ép Quỹ Đạo Mắt', d: 'Thay vì đọc từ trái sang phải như rùa bò, tia năng lượng ép mắt học viên phải quét chéo góc trang sách trong 3 giây để chụp hình từ khóa.' }
        };

        const readerContainer = document.getElementById('reader-container');

        // Hàm Tải Văn Bản
        function loadText() {
            const index = document.getElementById('text-selector').value;
            readerContainer.innerHTML = textsData[index].content;
        }

        // Hàm Đổi Chế Độ Skimming
        function setMode(mode, btnElement) {
            // Đổi màu nút
            document.querySelectorAll('.btn-3d').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // Cập nhật Insight Box
            document.getElementById('insight-title').innerHTML = `<i class="fa-solid fa-lightbulb text-yellow-500"></i> ${insights[mode].t}`;
            document.getElementById('insight-desc').innerText = insights[mode].d;

            // Xóa class cũ, thêm class mới
            readerContainer.className = `max-w-3xl mx-auto font-serif text-lg md:text-xl leading-relaxed text-gray-800 transition-all duration-500 mode-${mode}`;
        }

        // Khởi tạo lần đầu
        window.onload = () => {
            loadText();
        }
    </script>
</body>
</html>
