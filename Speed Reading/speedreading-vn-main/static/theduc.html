    <style>
        @keyframes pump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .animate-pump { animation: pump 0.46s infinite; }
        
        /* Breathing Animations */
        @keyframes inhale { 0% { transform: scale(1); } 100% { transform: scale(1.25); } }
        .animate-inhale { animation: inhale linear forwards; }
        
        @keyframes hold { 0%, 100% { transform: scale(1.25); } 50% { transform: scale(1.27); } }
        .animate-hold { animation: hold 2s infinite ease-in-out; }
        
        @keyframes exhale { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
        .animate-exhale { animation: exhale linear forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes zoomSlow { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        .bg-zoom { animation: zoomSlow 20s linear infinite alternate; }
        
        * { -webkit-tap-highlight-color: transparent; }
        body { user-select: none; -webkit-user-select: none; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>

        };

        const PROGRAMS = {
            FAT_BURN: { name: "Đốt Mỡ (Chuẩn)", high: 45, low: 15, rest: 15, desc: "Tỉ lệ vàng 3:1.", totalMinutes: 15 },
            TABATA: { name: "Tabata (Siêu Tốc)", high: 20, low: 0, rest: 10, desc: "Cực nặng, cực nhanh.", totalMinutes: 4 },
            BREATHING: { name: "Hít Thở 1-4-2", high: 4, low: 16, rest: 8, desc: "Năng lượng (Ngày 1).", totalMinutes: 5 },
            ENDURANCE: { name: "Sức Bền", high: 60, low: 30, rest: 0, desc: "Duy trì nhịp tim.", totalMinutes: 20 },
            CUSTOM: { name: "Tùy Chỉnh", desc: "Thiết lập theo ý bạn." },
            AI_GEN: { name: "✨ AI Thiết Kế", desc: "Bài tập thông minh." }
        };

        const MOCK_WORKOUTS = {
            ABS: [{"high": "Gập bụng đạp xe", "highDesc": "Xoay người chạm khuỷu tay", "low": "Plank tĩnh", "lowDesc": "Siết chặt cơ bụng"}, {"high": "Leo núi chéo chân", "highDesc": "Kéo gối về phía tay đối diện", "low": "Gập bụng cơ bản", "lowDesc": "Tập trung cơ bụng trên"}],
            CARDIO: [{"high": "Chạy nâng cao đùi", "highDesc": "Tốc độ tối đa!", "low": "Bước sang ngang", "lowDesc": "Hít thở sâu"}, {"high": "Burpees", "highDesc": "Bật nhảy hết sức", "low": "Đi bộ tại chỗ", "lowDesc": "Thả lỏng tay chân"}],
            LEGS: [{"high": "Squat bật nhảy", "highDesc": "Tiếp đất nhẹ nhàng", "low": "Squat thường", "lowDesc": "Xuống chậm lên nhanh"}, {"high": "Lunge đổi chân", "highDesc": "Giữ thăng bằng", "low": "Đứng kiễng chân", "lowDesc": "Tập bắp chân"}]
        };

        // --- APP STATE ---
        const state = {
            apiKey: localStorage.getItem('gemini_api_key') || "",
            settings: { mode: 'FAT_BURN', high: 45, low: 15, rest: 15, totalMinutes: 15 },
            isRunning: false,
            isFinished: false,
            isMuted: false,
            totalTimeLeft: 15 * 60,
            cycleIndex: 0,
            intervalTimeLeft: 45,
            currentAiPairIndex: 0,
            aiExercises: null,
            aiAdvice: null,
            loadingAdvice: false
        };

        // --- AUDIO ENGINE ---
        const AudioEngine = () => {
            let audioCtx = null;
            let nextNoteTime = 0;
            let timerID = null;
            let isPlaying = false;
            let intensity = 'high';
            let beatCount = 0;

            const init = () => {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            };

            const playSoundSynth = (time, type, freq, attack, decay, vol, isKick = false) => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(vol, time + attack);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + attack + decay);
                    if (isKick) {
                        osc.frequency.setValueAtTime(freq * 1.5, time);
                        osc.frequency.exponentialRampToValueAtTime(freq, time + attack);
                    }
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + attack + decay + 0.1);
                } catch (e) {
                    console.error("Audio error: ", e);
                }
            };

            const playCountdown = (isFinal) => {
                init();
                const t = audioCtx.currentTime;
                if (isFinal) playSoundSynth(t, 'square', 880, 0.01, 0.8, 0.4);
                else playSoundSynth(t, 'triangle', 660, 0.01, 0.1, 0.4);
            };

            const scheduleNote = (beatNumber, time) => {
                const beat16 = beatCount % 16;
                if (intensity === 'low') {
                    if (beat16 % 8 === 0) playSoundSynth(time, 'sine', 150, 0.2, 1.5, 0.2);
                    if (beat16 % 16 === 0) playSoundSynth(time + 0.1, 'triangle', 220, 0.2, 1.5, 0.05);
                } else {
                    if (beat16 % 4 === 0) playSoundSynth(time, 'sine', 50, 0.005, 0.25, 0.8, true);
                    if (beat16 === 4 || beat16 === 12) playSoundSynth(time, 'square', 1200, 0.001, 0.08, 0.15);
                    if (beat16 % 4 === 2) playSoundSynth(time, 'sawtooth', 5000, 0.005, 0.15, 0.08);
                    const bassFreq = (beatCount < 32 ? 55 : 65.4) * (beat16 % 2 === 0 ? 1 : 2);
                    playSoundSynth(time + 0.02, 'sawtooth', bassFreq, 0.01, 0.1, 0.2);
                }
                beatCount++;
            };

            const scheduler = () => {
                if (!isPlaying || !audioCtx) return;
                const tempo = intensity === 'high' ? 132 : 60; 
                const secondsPerBeat = 15.0 / tempo; 
                while (nextNoteTime < audioCtx.currentTime + 0.1) {
                    scheduleNote(beatCount, nextNoteTime);
                    nextNoteTime += secondsPerBeat;
                }
                timerID = window.setTimeout(scheduler, 25);
            };

            const startMusic = (mode) => {
                init();
                isPlaying = true;
                intensity = mode;
                if(mode !== 'high') intensity = 'low'; 
                beatCount = 0;
                if (!timerID) {
                    nextNoteTime = audioCtx.currentTime + 0.05;
                    scheduler();
                }
            };

            const stopMusic = () => {
                isPlaying = false;
                if (timerID) { window.clearTimeout(timerID); timerID = null; }
            };

            return { init, playCountdown, startMusic, stopMusic };
        };

        const audio = AudioEngine();

        // --- GEMINI INTEG ---
        const callGemini = async (prompt, apiKey) => {
            if (!apiKey) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        let category = 'CARDIO';
                        const p = prompt.toLowerCase();
                        if (p.includes('bụng') || p.includes('eo')) category = 'ABS';
                        else if (p.includes('chân') || p.includes('đùi')) category = 'LEGS';
                        const source = MOCK_WORKOUTS[category];
                        const exercises = Array(4).fill(0).map(() => source[Math.floor(Math.random() * source.length)]);
                        resolve(JSON.stringify(exercises));
                    }, 1500);
                });
            }
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const response = await fetch(url, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: prompt }] }] 
                }) 
            });
            if (!response.ok) throw new Error(`Lỗi API: ${response.status}`);
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text;
        };

        // --- CORE LOGIC FLOW ---
        function getCycleConfig() {
            const settings = state.settings;
            if (settings.mode === 'BREATHING') {
                return [
                    { id: 0, type: 'inhale', color: 'bg-gradient-to-br from-cyan-400 to-blue-600', icon: 'wind', label: 'HÍT VÀO', msg: 'Hít sâu bằng mũi...', duration: settings.high },
                    { id: 1, type: 'hold', color: 'bg-gradient-to-br from-yellow-400 to-orange-500', icon: 'lock', label: 'GIỮ HƠI', msg: 'Giữ chặt trong phổi...', duration: settings.low },
                    { id: 2, type: 'exhale', color: 'bg-gradient-to-br from-emerald-400 to-green-600', icon: 'wind', label: 'THỞ RA', msg: 'Thở mạnh bằng miệng...', duration: settings.rest }
                ];
            }

            let baseConfig = [
                { id: 0, type: 'high', color: 'bg-gradient-to-br from-red-600 to-orange-800', icon: 'zap' },
                { id: 1, type: 'low', color: 'bg-gradient-to-br from-yellow-500 to-orange-500', icon: 'activity' },
                { id: 2, type: 'high', color: 'bg-gradient-to-br from-orange-600 to-red-700', icon: 'zap' },
                { id: 3, type: 'rest', color: 'bg-gradient-to-br from-blue-500 to-cyan-500', icon: 'coffee', label: 'Nghỉ Ngơi', msg: 'Thở sâu...' }
            ];

            if (state.settings.mode === 'AI_GEN' && state.aiExercises && state.aiExercises.length > 0) {
                const ex = state.aiExercises[state.currentAiPairIndex % state.aiExercises.length];
                baseConfig[0].label = ex.high; baseConfig[0].msg = ex.highDesc;
                baseConfig[1].label = ex.low; baseConfig[1].msg = ex.lowDesc;
                baseConfig[2].label = ex.high; baseConfig[2].msg = ex.highDesc;
            } else {
                baseConfig[0].label = 'Tập Nặng'; baseConfig[0].msg = 'Bùng nổ hết sức!';
                baseConfig[1].label = 'Tập Nhẹ'; baseConfig[1].msg = 'Hạ nhiệt chủ động';
                baseConfig[2].label = 'Tập Tiếp'; baseConfig[2].msg = 'Không bỏ cuộc!';
            }
            baseConfig[0].duration = settings.high;
            baseConfig[1].duration = settings.low;
            baseConfig[2].duration = settings.high;
            baseConfig[3].duration = settings.rest;
            return baseConfig;
        }

        function getCurrentDisplayConfig() {
            const cycleConfig = getCycleConfig();
            return cycleConfig[state.cycleIndex];
        }

        // --- DOM RENDERERS ---
        function renderIcons() {
            document.getElementById('header-timer-icon').innerHTML = SVGS.timer;
            document.getElementById('header-settings-icon').innerHTML = SVGS.settings;
            document.getElementById('header-mute-icon').innerHTML = state.isMuted ? SVGS.volumeX : SVGS.volume2;
            document.getElementById('control-reset-icon').innerHTML = SVGS.rotateCcw;
            document.getElementById('settings-header-icon').innerHTML = SVGS.settings;
            document.getElementById('settings-close-icon').innerHTML = SVGS.x;
            document.getElementById('ai-btn-sparkle').innerHTML = SVGS.sparkles;
            document.getElementById('finished-badge-icon').innerHTML = SVGS.activity;
            document.getElementById('advice-loading-icon').innerHTML = SVGS.sparkles;
            document.getElementById('advice-sparkle-icon').innerHTML = SVGS.sparkles;
            document.getElementById('facebook-icon').innerHTML = SVGS.facebook;
        }

        function updateUI() {
            // Update timers
            const min = Math.floor(state.totalTimeLeft / 60).toString().padStart(2, '0');
            const sec = (state.totalTimeLeft % 60).toString().padStart(2, '0');
            document.getElementById('total-time-left').textContent = `${min}:${sec}`;
            document.getElementById('interval-time-left').textContent = state.intervalTimeLeft;

            const current = getCurrentDisplayConfig();
            document.getElementById('current-label').textContent = current.label;
            document.getElementById('current-msg').textContent = current.msg || "";
            if (current.msg) {
                document.getElementById('current-msg').classList.remove('hidden');
            } else {
                document.getElementById('current-msg').classList.add('hidden');
            }

            // Icons dynamic update
            document.getElementById('current-action-icon').innerHTML = SVGS[current.icon];

            // Progress Ring
            const progressPercent = ((current.duration - state.intervalTimeLeft) / current.duration) * 100;
            const dashOffset = 816 - (816 * (progressPercent || 0)) / 100;
            document.getElementById('progress-bar').setAttribute('stroke-dashoffset', dashOffset);

            // Play/Pause button state
            const playText = state.isRunning ? "Dừng" : "Bắt đầu";
            const playIcon = state.isRunning ? SVGS.pause : SVGS.play;
            document.getElementById('control-play-text').textContent = playText;
            document.getElementById('control-play-icon').innerHTML = playIcon;

            const btnPlay = document.getElementById('btn-start-pause');
            if (state.isRunning) {
                btnPlay.className = "col-span-1 py-6 rounded-3xl flex items-center justify-center space-x-2 text-2xl font-bold shadow-2xl transform active:scale-95 transition duration-100 bg-white text-gray-900";
            } else {
                btnPlay.className = "col-span-1 py-6 rounded-3xl flex items-center justify-center space-x-2 text-2xl font-bold shadow-2xl transform active:scale-95 transition duration-100 bg-green-500 text-white";
            }

            // Animation classes based on state
            const glow = document.getElementById('circle-glow');
            const actionIcon = document.getElementById('current-action-icon');
            const countdownSvg = document.getElementById('countdown-svg');

            countdownSvg.className = "absolute top-0 left-0 w-full h-full transform -rotate-90 drop-shadow-2xl";
            actionIcon.className = "mb-2";

            if (state.isRunning) {
                if (current.type === 'inhale') actionIcon.classList.add('animate-inhale');
                else if (current.type === 'hold') actionIcon.classList.add('animate-hold');
                else if (current.type === 'exhale') actionIcon.classList.add('animate-exhale');
                else if (current.type === 'high') {
                    countdownSvg.classList.add('animate-pump');
                    glow.classList.remove('opacity-0');
                    glow.classList.add('opacity-20');
                } else {
                    actionIcon.classList.add('animate-bounce');
                    glow.classList.add('opacity-0');
                    glow.classList.remove('opacity-20');
                }
            } else {
                glow.classList.add('opacity-0');
                glow.classList.remove('opacity-20');
            }

            // Background dynamic set
            const bgImg = document.getElementById('bg-image');
            const bgOverlay = document.getElementById('bg-overlay');
            let bgUrl = "";
            if(current.type === 'inhale') bgUrl = "https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=1200&auto=format&fit=crop"; 
            else if(current.type === 'high') bgUrl = "https://images.unsplash.com/photo-1601422407692-ec4eeec1d9b3?q=80&w=1200&auto=format&fit=crop";
            else bgUrl = "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=1200&auto=format&fit=crop"; 

            bgImg.src = bgUrl;
            if (state.isRunning) {
                bgImg.classList.add('bg-zoom');
                bgImg.classList.remove('opacity-0');
                bgImg.classList.add('opacity-100');
                bgOverlay.className = "absolute inset-0 transition-colors duration-500 bg-black/70";
            } else {
                bgImg.classList.remove('bg-zoom');
                bgImg.classList.remove('opacity-100');
                bgImg.classList.add('opacity-0');
                bgOverlay.className = "absolute inset-0 transition-colors duration-500 " + current.color;
            }

            // Mode Badge
            document.getElementById('mode-badge').innerHTML = (state.settings.mode === 'AI_GEN' ? SVGS.sparkles + ' ' : '') + `Chế độ: ${PROGRAMS[state.settings.mode]?.name || 'Tùy Chỉnh'}`;

            // API indicator
            if (state.apiKey) {
                document.getElementById('api-key-indicator').classList.remove('hidden');
            } else {
                document.getElementById('api-key-indicator').classList.add('hidden');
            }

            renderTimeline();
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = "";
            const cycleConfig = getCycleConfig();

            for (let offset = 1; offset <= 3; offset++) {
                const idx = (state.cycleIndex + offset) % cycleConfig.length;
                let item = cycleConfig[idx];

                if (state.settings.mode === 'AI_GEN' && state.aiExercises) {
                    const previewPairIndex = (state.cycleIndex === 3 && idx === 0) ? (state.currentAiPairIndex + 1) : state.currentAiPairIndex;
                    const pair = state.aiExercises[previewPairIndex % state.aiExercises.length];
                    if (item.type === 'high') item = { ...item, label: pair.high };
                    if (item.type === 'low') item = { ...item, label: pair.low };
                }

                if (item.duration === 0) continue;

                let colorCircle = 'bg-blue-400';
                if (item.type === 'high') colorCircle = 'bg-red-500';
                else if (item.type === 'low') colorCircle = 'bg-yellow-400';
                else if (item.type === 'inhale') colorCircle = 'bg-cyan-400';
                else if (item.type === 'hold') colorCircle = 'bg-orange-400';
                else if (item.type === 'exhale') colorCircle = 'bg-green-400';

                const div = document.createElement('div');
                div.className = "flex-1 bg-white/5 rounded-xl p-3 flex flex-col items-center text-xs border border-white/10 overflow-hidden";
                div.innerHTML = `
                    <span class="w-3 h-3 rounded-full mb-2 shadow-lg ${colorCircle}"></span>
                    <span class="font-bold text-lg">${item.duration}</span>
                    <span class="truncate w-full text-center opacity-75 font-semibold">${item.label}</span>
                `;
                container.appendChild(div);
            }
        }

        // --- TIMER HANDLER ---
        let mainInterval = null;

        const handleNextPhaseInternal = () => {
            const cycleConfig = getCycleConfig();
            let nextIndex = (state.cycleIndex + 1) % cycleConfig.length;
            let nextConfig = cycleConfig[nextIndex];
            
            if (state.cycleIndex === 3 && nextIndex === 0 && state.settings.mode === 'AI_GEN' && state.aiExercises) {
                state.currentAiPairIndex = (state.currentAiPairIndex + 1) % state.aiExercises.length;
            }

            let attempts = 0;
            while (nextConfig.duration === 0 && attempts < 4) {
                nextIndex = (nextIndex + 1) % cycleConfig.length;
                nextConfig = cycleConfig[nextIndex];
                attempts++;
            }
            state.cycleIndex = nextIndex;
            state.intervalTimeLeft = nextConfig.duration;

            if (!state.isMuted && state.isRunning) {
                audio.stopMusic();
                setTimeout(() => audio.startMusic(nextConfig.type === 'inhale' ? 'low' : nextConfig.type), 50);
            }
        };

        function startTimer() {
            if (mainInterval) clearInterval(mainInterval);
            mainInterval = setInterval(() => {
                if (state.isRunning && state.totalTimeLeft > 0) {
                    state.totalTimeLeft--;
                    if (state.intervalTimeLeft <= 4 && state.intervalTimeLeft > 1 && !state.isMuted) {
                        audio.playCountdown(false);
                    }
                    if (state.intervalTimeLeft === 1 && !state.isMuted) {
                        audio.playCountdown(true);
                    }

                    if (state.intervalTimeLeft <= 1) {
                        handleNextPhaseInternal();
                    } else {
                        state.intervalTimeLeft--;
                    }
                    updateUI();
                } else if (state.totalTimeLeft === 0 && state.isRunning) {
                    finishWorkout();
                }
            }, 1000);
        }

        function finishWorkout() {
            state.isFinished = true;
            state.isRunning = false;
            audio.stopMusic();
            if (!state.isMuted) audio.playCountdown(true);
            clearInterval(mainInterval);

            document.getElementById('finished-screen').classList.remove('hidden');
            document.getElementById('finished-screen').classList.add('flex');

            // Render advice
            getAiAdvice();
        }

        const getAiAdvice = async () => {
            document.getElementById('advice-loading').classList.remove('hidden');
            document.getElementById('advice-container').classList.add('hidden');
            try {
                if (!state.apiKey) {
                    setTimeout(() => { 
                        displayAdvice("🎉 Hoàn thành xuất sắc! Hãy bổ sung nước lọc ngay và nghỉ ngơi nhẹ nhàng nhé."); 
                    }, 1000);
                } else {
                    const prompt = `User just finished a ${state.settings.totalMinutes} min workout (${state.settings.mode}). Tone: Funny, energetic, Vietnamese. Output: 1 congratulation + 1 nutrition tip in plain text.`;
                    const text = await callGemini(prompt, state.apiKey);
                    displayAdvice(text);
                }
            } catch (e) { 
                console.error(e); 
                displayAdvice("Lỗi khi kết nối HLV ảo, bạn đã tập cực tốt rồi!");
            }
        };

        function displayAdvice(text) {
            document.getElementById('advice-loading').classList.add('hidden');
            document.getElementById('advice-container').classList.remove('hidden');
            document.getElementById('advice-text').textContent = text;
        }

        function handleStartPause() {
            if (!state.isRunning) {
                audio.init();
                const current = getCurrentDisplayConfig();
                if (!state.isMuted) {
                    audio.startMusic(current.type === 'inhale' ? 'low' : current.type);
                }
                state.isRunning = true;
                startTimer();
            } else {
                audio.stopMusic();
                state.isRunning = false;
            }
            updateUI();
        }

        function handleReset() {
            state.isRunning = false;
            state.isFinished = false;
            state.totalTimeLeft = state.settings.totalMinutes * 60;
            state.cycleIndex = 0;
            state.currentAiPairIndex = 0;
            const cycleConfig = getCycleConfig();
            state.intervalTimeLeft = cycleConfig[0].duration;
            audio.stopMusic();
            if (mainInterval) clearInterval(mainInterval);

            document.getElementById('finished-screen').classList.add('hidden');
            document.getElementById('finished-screen').classList.remove('flex');

            updateUI();
        }

        // --- PRESETS MODAL ACTIONS ---
        function openSettings() {
            // Populate active fields
            document.getElementById('api-key-input').value = state.apiKey;
            document.getElementById('slide-high').value = state.settings.high;
            document.getElementById('slide-low').value = state.settings.low;
            document.getElementById('slide-rest').value = state.settings.rest;
            document.getElementById('slide-total').value = state.settings.totalMinutes;

            updateSliderValuesDisplay();
            renderPresetButtons();
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function updateSliderValuesDisplay() {
            const isBreathing = state.settings.mode === 'BREATHING';
            
            document.getElementById('slider-label-high').textContent = isBreathing ? "Hít vào (s)" : "Nặng (Giây)";
            document.getElementById('slider-label-low').textContent = isBreathing ? "Giữ hơi (s)" : "Nhẹ (Giây)";
            document.getElementById('slider-label-rest').textContent = isBreathing ? "Thở ra (s)" : "Nghỉ (Giây)";

            document.getElementById('val-high').textContent = document.getElementById('slide-high').value + 's';
            document.getElementById('val-low').textContent = document.getElementById('slide-low').value + 's';
            document.getElementById('val-rest').textContent = document.getElementById('slide-rest').value + 's';
            document.getElementById('val-total').textContent = document.getElementById('slide-total').value + "'";

            // Disable sliders if pre-set modes
            const slidersContainer = document.getElementById('sliders-container');
            if (state.settings.mode !== 'CUSTOM' && state.settings.mode !== 'AI_GEN' && state.settings.mode !== 'BREATHING') {
                slidersContainer.classList.add('opacity-50', 'pointer-events-none', 'grayscale');
            } else {
                slidersContainer.classList.remove('opacity-50', 'pointer-events-none', 'grayscale');
            }

            const aiSection = document.getElementById('ai-section');
            if (isBreathing) {
                aiSection.classList.add('hidden');
            } else {
                aiSection.classList.remove('hidden');
            }
        }

        function selectPreset(key) {
            if (key === 'CUSTOM' || key === 'AI_GEN') {
                state.settings.mode = key;
            } else {
                const prog = PROGRAMS[key];
                state.settings.mode = key;
                state.settings.high = prog.high;
                state.settings.low = prog.low;
                state.settings.rest = prog.rest;
                state.settings.totalMinutes = prog.totalMinutes || 5;

                document.getElementById('slide-high').value = prog.high;
                document.getElementById('slide-low').value = prog.low;
                document.getElementById('slide-rest').value = prog.rest;
                document.getElementById('slide-total').value = prog.totalMinutes || 5;
            }
            renderPresetButtons();
            updateSliderValuesDisplay();
        }

        function renderPresetButtons() {
            const container = document.getElementById('presets-container');
            container.innerHTML = "";
            Object.keys(PROGRAMS).forEach(key => {
                const isActive = state.settings.mode === key;
                const button = document.createElement('button');
                button.className = `p-3 rounded-xl border text-left transition-all ${isActive ? 'bg-blue-600 border-blue-400 shadow-lg scale-[1.02]' : 'bg-white/5 border-white/10 hover:bg-white/10'}`;
                button.innerHTML = `
                    <div class="font-bold text-white flex justify-between">
                        <span>${PROGRAMS[key].name}</span>
                        ${key === 'BREATHING' ? SVGS.wind : ''}
                    </div>
                    <div class="text-xs text-white/60">${PROGRAMS[key].desc}</div>
                `;
                button.onclick = () => selectPreset(key);
                container.appendChild(button);
            });
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            renderIcons();

            // Mute Button Handler
            document.getElementById('btn-mute-toggle').onclick = () => {
                state.isMuted = !state.isMuted;
                document.getElementById('header-mute-icon').innerHTML = state.isMuted ? SVGS.volumeX : SVGS.volume2;
                if (state.isMuted) audio.stopMusic();
                else if (state.isRunning) {
                    const current = getCurrentDisplayConfig();
                    audio.startMusic(current.type === 'inhale' ? 'low' : current.type);
                }
            };

            // Start & Pause click
            document.getElementById('btn-start-pause').onclick = handleStartPause;

            // Reset click
            document.getElementById('btn-reset').onclick = handleReset;
            document.getElementById('btn-finished-reset').onclick = handleReset;

            // Settings modal toggles
            document.getElementById('btn-settings-open').onclick = openSettings;
            document.getElementById('btn-settings-close').onclick = closeSettings;

            // Slider input updates
            ['high', 'low', 'rest', 'total'].forEach(id => {
                const slider = document.getElementById(`slide-${id}`);
                slider.oninput = () => {
                    updateSliderValuesDisplay();
                };
            });

            // Save Settings Click
            document.getElementById('btn-save-settings').onclick = () => {
                const highVal = parseInt(document.getElementById('slide-high').value);
                const lowVal = parseInt(document.getElementById('slide-low').value);
                const restVal = parseInt(document.getElementById('slide-rest').value);
                const totalVal = parseInt(document.getElementById('slide-total').value);

                state.settings.high = highVal;
                state.settings.low = lowVal;
                state.settings.rest = restVal;
                state.settings.totalMinutes = totalVal;

                state.apiKey = document.getElementById('api-key-input').value.trim();
                localStorage.setItem('gemini_api_key', state.apiKey);

                closeSettings();
                handleReset();
            };

            // AI Generator Click
            document.getElementById('btn-generate-ai').onclick = async () => {
                const goal = document.getElementById('ai-prompt-input').value.trim() || "Giảm mỡ toàn thân";
                const apiKey = document.getElementById('api-key-input').value.trim();
                
                document.getElementById('ai-btn-text').textContent = "Đang thiết kế...";
                document.getElementById('btn-generate-ai').disabled = true;

                try {
                    let exercises;
                    if (!apiKey) {
                        const text = await callGemini(goal, null);
                        exercises = JSON.parse(text);
                    } else {
                        const prompt = `You are a HIIT coach. Goal: '${goal}'. Generate 4 pairs of exercises. Return ONLY raw JSON array: [{"high": "Name", "highDesc": "Desc", "low": "Name", "lowDesc": "Desc"}]`;
                        const text = await callGemini(prompt, apiKey);
                        exercises = JSON.parse(text.replace(/```json|```/g, '').trim());
                    }
                    state.aiExercises = exercises;
                    state.settings.mode = 'AI_GEN';
                    renderPresetButtons();
                    updateSliderValuesDisplay();
                    alert(!apiKey ? "Đã tạo bài tập giả lập thành công!" : "Đã tạo bài tập từ HLV Gemini AI!");
                } catch (e) {
                    alert("Lỗi tạo bài tập AI: " + e.message);
                } finally {
                    document.getElementById('ai-btn-text').textContent = "Thiết kế Bài tập";
                    document.getElementById('btn-generate-ai').disabled = false;
                }
            };

            // Set initial UI state
            updateUI();
        };
    </script>
</body>
