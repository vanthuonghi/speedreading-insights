{{- $id := .Get "id" | default (.Get 0) -}}
<div class="youtube-lazy-container" style="margin: 2rem 0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; background: #000;">
        <iframe
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; z-index: 1;"
            src="https://www.youtube-nocookie.com/embed/{{ $id }}"
            srcdoc="<style>
                * { padding: 0; margin: 0; overflow: hidden; }
                body, html { height: 100%; background: #000; }
                img { position: absolute; width: 100%; top: 0; bottom: 0; margin: auto; object-fit: cover; transition: transform 0.5s; }
                .overlay { position: absolute; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 100%); z-index: 2; }
                .play-btn { 
                    width: 80px; height: 80px; background: rgba(255, 255, 255, 0.9); 
                    border-radius: 50%; position: absolute; left: 50%; top: 50%; 
                    transform: translate(-50%, -50%); display: flex; justify-content: center; 
                    align-items: center; cursor: pointer; z-index: 3; transition: all 0.3s;
                    box-shadow: 0 0 30px rgba(0,0,0,0.2);
                }
                .play-triangle { 
                    width: 0; height: 0; border-top: 12px solid transparent; 
                    border-bottom: 12px solid transparent; border-left: 20px solid #f00; 
                    margin-left: 5px; 
                }
                a:hover img { transform: scale(1.05); }
                a:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: #fff; }
            </style>
            <a href='https://www.youtube-nocookie.com/embed/{{ $id }}?autoplay=1'>
                <img src='https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg' alt='Speed Reading Review'>
                <div class='overlay'></div>
                <div class='play-btn'><div class='play-triangle'></div></div>
            </a>"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
</div>
