<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reading Việt Nam - X3 Tốc độ đọc hiểu</title>
    <meta name="description" content="Khóa học Speed Reading giúp tăng tốc độ đọc hiểu, ghi nhớ gấp 3 lần chỉ sau 7 ngày.">
    
    <!-- 1. Cài đặt Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Cấu hình Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>

    <!-- 3. Cài đặt Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font chữ đẹp -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }

        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; color: #991b1b; }
            50% { background-color: #ef4444; color: white; }
        }
        .animate-pulse-urgent { animation: pulse-red 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 4. Mã nguồn React -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Clock, BookOpen, Brain, CheckCircle, AlertTriangle, 
            ChevronDown, ChevronUp, Star, Zap, ShieldCheck, 
            ArrowRight, User, Mail, Phone, Loader, PlayCircle, 
            Building, GraduationCap, Users, Quote, XCircle, Target,
            Calendar, Music, FileText, CheckSquare, Gift, Video, Book,
            Lock, Play, X, Trophy
        } from 'lucide-react';

        // --- Data ---
        const LESSONS_DATA = [
            { id: 1, title: "Bài 1: Tại sao bạn cần kỹ năng đọc hiểu nhanh", duration: "10:05", isFree: true, videoId: "fSd3Wlwfnjc" },
            { id: 2, title: "Bài 2: Lịch sữ Speed Reading Hoa Kỳ", duration: "08:30", isFree: true, videoId: "WNda9q_Ler0" },
            { id: 3, title: "Bài 3: Nguyên lý hoạt động của não bộ", duration: "12:15", isFree: false },
            { id: 4, title: "Bài 4: Kỹ thuật loại bỏ đọc thầm", duration: "15:20", isFree: false },
            { id: 5, title: "Bài 5: Mở rộng tầm nhìn ngoại vi", duration: "09:45", isFree: false },
            { id: 6, title: "Bài 6: Kỹ thuật làm mềm sách", duration: "11:10", isFree: false },
            { id: 7, title: "Bài 7: Tư thế ngồi chuẩn", duration: "07:50", isFree: false },
            { id: 8, title: "Bài 8: Kỹ thuật lật trang tốc độ cao", duration: "14:00", isFree: false },
            { id: 9, title: "Bài 9: Kỹ thuật chỉ tay 1 dòng", duration: "20:00", isFree: false },
            { id: 10, title: "Bài 10: Kỹ thuật chỉ tay 2 dòng", duration: "18:45", isFree: false },
            { id: 11, title: "Bài 11: Kỹ thuật Lazy S (Đỉnh cao)", duration: "22:15", isFree: false },
            { id: 12, title: "Bài 12: Công thức 3-2-1", duration: "25:30", isFree: false },
            { id: 13, title: "Bài 13: Sơ đồ tư duy (Mindmap)", duration: "30:00", isFree: false },
            { id: 14, title: "Bài 14: Công thức PRPR (Preview - Read...)", duration: "19:20", isFree: false },
            { id: 15, title: "Bài 15: Quy trình luyện tập mỗi ngày", duration: "16:50", isFree: false },
            { id: 16, title: "Bài 16: Ứng dụng đọc sách chuyên ngành", duration: "21:10", isFree: false },
            { id: 17, title: "Bài 17: Tổng kết & Định hướng", duration: "15:00", isFree: false },
        ];

        // --- Components ---

        const VideoModal = ({ videoId, onClose }) => {
            if (!videoId) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div className="bg-black w-full max-w-4xl aspect-video rounded-xl overflow-hidden shadow-2xl relative" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-2 right-2 md:top-4 md:right-4 z-10 bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors">
                            <X size={24} />
                        </button>
                        <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1`} title="YouTube video player" frameBorder="0" allowFullScreen></iframe>
                    </div>
                </div>
            );
        };

        const CTAButton = ({ text, subtext, onClick, variant = 'primary', type = 'button', disabled = false, isLoading = false, className = '' }) => {
            const baseClasses = `w-full md:w-auto font-bold uppercase tracking-wide py-4 px-8 rounded-full shadow-xl transform transition-all hover:scale-105 active:scale-95 flex flex-col items-center justify-center text-center disabled:opacity-70 disabled:cursor-not-allowed ${className}`;
            const variants = {
                primary: "bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-red-900 border-b-4 border-yellow-700",
                secondary: "bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white border-b-4 border-red-900",
                white: "bg-white hover:bg-gray-50 text-red-600 border-b-4 border-gray-200"
            };
            return (
                <button onClick={onClick} type={type} disabled={disabled} className={`${baseClasses} ${variants[variant]}`}>
                    {isLoading ? (
                        <span className="flex items-center gap-2"><Loader className="animate-spin" size={24} /> Đang xử lý...</span>
                    ) : (
                        <>
                            <span className="text-xl md:text-2xl flex items-center gap-2">{text} <ArrowRight size={24} /></span>
                            {subtext && <span className="text-xs md:text-sm font-normal mt-1 opacity-90">{subtext}</span>}
                        </>
                    )}
                </button>
            );
        };

        const Section = ({ children, className = "", id = "", maxWidth = "max-w-5xl" }) => (
            <section id={id} className={`py-16 px-4 md:px-0 relative ${className}`}>
                <div className={`${maxWidth} mx-auto relative z-10`}>{children}</div>
            </section>
        );

        const AccordionItem = ({ question, answer, isOpen, onClick }) => (
            <div className="border-b border-gray-200 last:border-0">
                <button className="w-full flex justify-between items-center py-4 text-left focus:outline-none hover:bg-gray-50 px-3 rounded-lg transition-colors" onClick={onClick}>
                    <span className="font-bold text-gray-800 text-lg pr-4">{question}</span>
                    {isOpen ? <ChevronUp className="text-red-600 flex-shrink-0" /> : <ChevronDown className="text-gray-400 flex-shrink-0" />}
                </button>
                <div className={`overflow-hidden transition-all duration-300 ease-in-out px-3 ${isOpen ? 'max-h-96 opacity-100 mb-4' : 'max-h-0 opacity-0'}`}>
                    <p className="text-gray-600 leading-relaxed">{answer}</p>
                </div>
            </div>
        );

        const InputField = ({ icon: Icon, type, name, placeholder, required = false }) => (
            <div className="relative mb-4">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500"><Icon size={20} /></div>
                <input type={type} name={name} required={required} placeholder={placeholder} className="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:border-transparent outline-none text-gray-900 placeholder-gray-500 bg-gray-50 transition-all" />
            </div>
        );

        const handleImageError = (e) => { e.target.src = "https://placehold.co/800x600/e2e8f0/1e293b?text=Image+Unavailable"; };

        const TestimonialCard = ({ name, role, quote, result, before, after }) => {
            const firstLetter = name ? name.charAt(0).toUpperCase() : 'U';
            return (
                <div className="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 flex flex-col h-full hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div className="flex items-center gap-4 mb-4">
                        <div className="w-16 h-16 rounded-full bg-gradient-to-br from-yellow-100 to-yellow-200 border-2 border-yellow-400 flex items-center justify-center flex-shrink-0 text-yellow-700 font-bold text-2xl shadow-inner">{firstLetter}</div>
                        <div>
                            <h4 className="font-bold text-gray-900 text-lg leading-tight">{name}</h4>
                            <p className="text-xs text-gray-500 uppercase tracking-wide mt-1">{role}</p>
                            <div className="flex text-yellow-400 mt-1">{[...Array(5)].map((_, i) => <Star key={i} fill="currentColor" size={14} />)}</div>
                        </div>
                    </div>
                    <div className="bg-gray-50 p-3 rounded-lg text-sm mb-4 border-l-4 border-blue-400">
                        <div className="flex justify-between items-center mb-1"><span className="text-gray-500 text-xs uppercase font-bold">Trước đây:</span><span className="text-gray-500 text-xs font-semibold">{before}</span></div>
                        <div className="flex justify-between items-center"><span className="text-red-600 text-xs uppercase font-bold">Hiện tại:</span><span className="text-red-600 text-xs font-bold">{after}</span></div>
                    </div>
                    <div className="relative mb-4 flex-grow">
                        <Quote className="absolute -top-2 -left-2 text-gray-200 transform -scale-x-100" size={30} />
                        <p className="text-gray-700 italic relative z-10 text-sm leading-relaxed pl-4">"{quote}"</p>
                    </div>
                    <div className="mt-auto bg-green-50 text-green-800 p-3 rounded-lg text-sm font-bold border border-green-100 flex items-center gap-2">
                        <CheckCircle size={18} className="flex-shrink-0 text-green-600" /><span>{result}</span>
                    </div>
                </div>
            );
        };

        const RoadmapDay = ({ day, title, content, color }) => (
            <div className="flex gap-4 items-start p-4 bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all">
                <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm ${color}`}>{day}</div>
                <div>
                    <h4 className="font-bold text-gray-900 text-lg flex items-center gap-2">{title}</h4>
                    <p className="text-sm text-gray-600 mt-1 leading-relaxed">{content}</p>
                </div>
            </div>
        );

        // --- Main Application ---
        function App() {
            const [timeLeft, setTimeLeft] = useState({ hours: 1, minutes: 45, seconds: 0 }); // Artificial urgency
            const [openFaqIndex, setOpenFaqIndex] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [showVideoSyllabus, setShowVideoSyllabus] = useState(true);
            const [activeVideoId, setActiveVideoId] = useState(null);

            const WEBHOOK_URL = "https://speedreading.vn/mail/?fluentcrm=1&route=contact&hash=aee46564-4940-4e4e-9f93-405fb58751b3";
            const REDIRECT_URL = "https://speedreading.vn/payment.html";

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
                        if (prev.minutes > 0) return { ...prev, minutes: prev.minutes - 1, seconds: 59 };
                        if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
                        return prev;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const scrollToCheckout = () => {
                document.getElementById('checkout-section').scrollIntoView({ behavior: 'smooth' });
            };

            const toggleFaq = (index) => {
                setOpenFaqIndex(openFaqIndex === index ? null : index);
            };

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const formData = new FormData(e.target);
                try {
                    await fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: formData });
                    window.location.href = REDIRECT_URL; 
                } catch (error) {
                    console.error("Submission error:", error);
                    alert("Có lỗi xảy ra. Vui lòng thử lại!");
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="font-sans text-gray-800 bg-dots min-h-screen pb-0 overflow-x-hidden relative">
                    <VideoModal videoId={activeVideoId} onClose={() => setActiveVideoId(null)} />

                    {/* 1. SCARCITY BAR (UPDATED STRATEGY) */}
                    <div className="fixed top-0 left-0 right-0 bg-red-600 text-white text-center py-3 z-50 font-bold text-xs md:text-sm shadow-md flex justify-center items-center gap-2">
                        <div className="flex items-center gap-1 animate-pulse">
                            <AlertTriangle size={16} className="text-yellow-300"/>
                            <span className="uppercase">CẢNH BÁO: CHỈ CÒN 8 SUẤT ƯU ĐÃI GIÁ 980K + QUÀ TẶNG COACHING 1:1</span>
                        </div>
                    </div>

                    {/* 2. HERO SECTION (UPDATED COPY) */}
                    <div className="relative pt-32 pb-20 bg-gray-900 text-white overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Student Studying" className="w-full h-full object-cover opacity-20" />
                            <div className="absolute inset-0 bg-gradient-to-b from-gray-900/95 via-gray-900/80 to-gray-900"></div>
                        </div>

                        <div className="relative z-10 max-w-5xl mx-auto text-center px-4">
                            <div className="inline-flex items-center gap-2 bg-yellow-500 text-red-900 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-6 shadow-lg animate-fade-in-up border border-yellow-400">
                                <Trophy size={14} /> Giải pháp thăng tiến cho người bận rộn
                            </div>
                            
                            <h1 className="flex flex-col items-center justify-center font-extrabold mb-6 drop-shadow-xl tracking-tight">
                                <span className="text-3xl md:text-5xl leading-tight mb-2 block text-gray-100">
                                    ĐỌC HIỂU NHANH GẤP 3 LẦN
                                </span>
                                <span className="text-4xl md:text-6xl lg:text-7xl text-yellow-400 leading-tight block uppercase">
                                    NẮM TRỌN KIẾN THỨC <br/> CHỈ TRONG 15 PHÚT
                                </span>
                            </h1>
                            
                            <p className="text-lg md:text-xl text-gray-300 mb-8 max-w-3xl mx-auto leading-relaxed font-light">
                                "Sếp hỏi đến đâu, trả lời vanh vách đến đó." <br/>
                                Đừng để sự chậm trễ khiến bạn mất đi cơ hội thăng tiến. Tiết kiệm hàng ngàn giờ làm việc mỗi năm.
                            </p>
                            
                            <div className="max-w-xs md:max-w-md mx-auto mb-8">
                                <CTAButton 
                                    text="X3 KẾT QUẢ NGAY" 
                                    subtext="Chỉ 980k - Hoàn tiền 100% nếu không hiệu quả"
                                    variant="primary"
                                    onClick={scrollToCheckout}
                                    className="w-full"
                                />
                            </div>
                            
                            <div className="flex flex-wrap justify-center gap-4 md:gap-8 text-sm text-gray-400 font-medium">
                                <span className="flex items-center gap-1.5"><Users size={18} className="text-green-500"/> 20.000+ Học viên</span>
                                <span className="flex items-center gap-1.5"><ShieldCheck size={18} className="text-blue-500"/> Cam kết hoàn tiền</span>
                            </div>
                        </div>
                    </div>

                    {/* 3. PROBLEM VISUALIZED (INSIGHT DRIVEN) */}
                    <Section className="bg-white">
                        <div className="grid md:grid-cols-2 gap-10 items-center">
                            <div className="relative group">
                                <div className="absolute inset-0 bg-red-600 rounded-2xl transform rotate-3 opacity-10 group-hover:rotate-6 transition-transform"></div>
                                <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Căng thẳng công việc" className="relative rounded-2xl shadow-xl w-full object-cover h-auto md:h-96 hover:scale-[1.02] transition-all duration-500 border border-gray-200" onError={handleImageError} />
                            </div>
                            <div>
                                <h2 className="text-3xl font-bold mb-6 leading-tight text-gray-900">Bạn có đang rơi vào trạng thái "tụt hậu" không phanh?</h2>
                                <p className="text-gray-600 mb-6 text-lg">
                                    Trong khi đồng nghiệp đã nắm bắt xong xu hướng mới, bạn vẫn đang vật lộn với chồng tài liệu từ tuần trước.
                                </p>
                                <ul className="space-y-4">
                                    <li className="flex items-start">
                                        <XCircle className="text-red-500 mr-3 flex-shrink-0 mt-1" />
                                        <div>
                                            <span className="font-bold text-gray-900">Áp lực họp hành:</span>
                                            <p className="text-sm text-gray-500">Sợ bị sếp hỏi bất chợt về một báo cáo mà bạn "chưa kịp đọc".</p>
                                        </div>
                                    </li>
                                    <li className="flex items-start">
                                        <XCircle className="text-red-500 mr-3 flex-shrink-0 mt-1" />
                                        <div>
                                            <span className="font-bold text-gray-900">Quá tải thông tin:</span>
                                            <p className="text-sm text-gray-500">Email, sách chuyên ngành, tin tức... ngốn sạch thời gian nghỉ ngơi của bạn.</p>
                                        </div>
                                    </li>
                                    <li className="flex items-start">
                                        <XCircle className="text-red-500 mr-3 flex-shrink-0 mt-1" />
                                        <div>
                                            <span className="font-bold text-gray-900">Cơ hội vụt mất:</span>
                                            <p className="text-sm text-gray-500">Kiến thức là tiền bạc. Đọc chậm đồng nghĩa với việc bạn đang để tiền rơi.</p>
                                        </div>
                                    </li>
                                </ul>
                                <div className="mt-8">
                                    <CTAButton text="TÔI MUỐN THAY ĐỔI NGAY" variant="secondary" onClick={scrollToCheckout} className="w-full md:w-auto text-sm py-3 px-6"/>
                                </div>
                            </div>
                        </div>
                    </Section>

                    {/* 4. SOLUTION & SYLLABUS */}
                    <Section className="bg-gray-50 border-t border-gray-200" maxWidth="max-w-6xl">
                        <div className="text-center mb-8">
                            <span className="text-xs font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">GIẢI PHÁP HYBRID ĐỘC QUYỀN</span>
                            <h2 className="text-3xl font-bold text-gray-900">Lộ Trình Tinh Gọn Để Thành Công</h2>
                            <p className="text-gray-500 mt-2 max-w-2xl mx-auto">Kết hợp Video học mọi lúc mọi nơi + Coaching trực tiếp sửa lỗi.</p>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                            <div className="p-5 bg-gradient-to-r from-blue-50 to-white border-b border-gray-100 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors" onClick={() => setShowVideoSyllabus(!showVideoSyllabus)}>
                                <div className="flex items-center gap-3">
                                    <div className="bg-red-600 text-white p-2 rounded-full shadow-md">
                                        <Play size={20} fill="currentColor" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg text-gray-800">Module 1: Khoá Video 17 Bài (Trọn đời)</h3>
                                        <p className="text-xs text-green-600 font-bold">Xem thử 2 bài đầu tiên miễn phí</p>
                                    </div>
                                </div>
                                {showVideoSyllabus ? <ChevronUp size={24} className="text-gray-400" /> : <ChevronDown size={24} className="text-gray-400" />}
                            </div>
                            
                            <div className={`transition-all duration-500 ease-in-out bg-gray-50/50 ${showVideoSyllabus ? 'max-h-[800px] overflow-y-auto opacity-100' : 'max-h-0 opacity-0 overflow-hidden'}`}>
                                <div className="grid md:grid-cols-2 gap-4 p-4 md:p-6">
                                    {LESSONS_DATA.map((lesson) => (
                                        <div key={lesson.id} className={`relative group p-4 rounded-xl border transition-all duration-200 flex items-center justify-between gap-3 ${lesson.isFree ? 'bg-white border-blue-100 hover:border-blue-300 cursor-pointer' : 'bg-gray-100 border-gray-200 opacity-80'}`} onClick={() => lesson.isFree && setActiveVideoId(lesson.videoId)}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${lesson.isFree ? 'bg-blue-100 text-blue-600' : 'bg-gray-200 text-gray-500'}`}>
                                                    {lesson.isFree ? <Play size={18} fill="currentColor" className="ml-0.5" /> : <Lock size={18} />}
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-sm text-gray-800">{lesson.title}</h4>
                                                    <span className="text-xs text-gray-400 flex items-center gap-1 mt-1"><Clock size={10} /> {lesson.duration}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Module 2: Zoom Roadmap */}
                        <div className="mt-8 grid md:grid-cols-2 gap-6 relative z-10">
                            <div className="md:col-span-2 text-center mb-4">
                                <h3 className="text-2xl font-bold text-gray-900">Module 2: 7 Buổi Zoom Thực Chiến (Kèm cặp 1:1)</h3>
                                <p className="text-gray-500 text-sm">Đây là chìa khoá để bạn áp dụng thành công.</p>
                            </div>
